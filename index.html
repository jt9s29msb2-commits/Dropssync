<script>
const R=[{n:'Common',c:'#2ee08a',d:'#14a361',coins:5},{n:'Uncommon',c:'#b06bff',d:'#7a3dd8',coins:12},{n:'Rare',c:'#ffb627',d:'#ff8a1f',coins:30},{n:'Epic',c:'#ff3d81',d:'#3aa0ff',coins:100}];

try{if(localStorage.getItem('drops-wipe')!=='2'){Object.keys(localStorage).filter(k=>/^drops-(v1|ed|market|pool|art)/.test(k)).forEach(k=>localStorage.removeItem(k));localStorage.setItem('drops-wipe','2')}}catch(e){}
const ACC=()=>{try{return JSON.parse(localStorage.getItem('drops-acc'))||{}}catch(e){return{}}};
const RES=k=>k.normalize('NFKD').replace(/[^a-z0-9]/g,'')==='theweeknd';
let USER=null;try{const u=localStorage.getItem('drops-user');if(u&&ACC()[u]&&(!RES(u)||(u==='theweeknd'&&localStorage.getItem('drops-adm'))))USER=u}catch(e){}
const KEY='drops-v1:'+(USER||'-');
let S={cards:[],coins:0},tab=2,results=[],q='',busy=false;

const save=()=>{if(!USER)return;if(USER==='theweeknd')S.coins=1e9;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// Seltenheit: fest aus der Song-ID berechnet, damit ein Song immer gleich selten bleibt
function rarityOf(id){const h=Math.imul(id|0,2654435761)>>>0;const n=Math.floor(h/4294967296*100);return n<55?0:n<80?1:n<94?2:3}

function cardHTML(c,mini){

}

function showCard(c,msg){$('#msg').textContent=msg||'';$('#big').innerHTML=cardHTML(c,false).replace(' data-open="'+c.id+'"','');const v=CANVAS[c.id]||CANVAS[(c.title+'|'+c.artist).toLowerCase()];if(v)$('#big .card img').outerHTML=`<video src="${esc(v)}" autoplay loop muted playsinline></video>`;const mine=!view&&S.cards.some(x=>x.id===c.id),q=$('#qs');q.hidden=!mine;if(mine){q.textContent=`Quicksell · ${QS[c.r]} Münzen`;q.dataset.qs=c.id}$('#ov').classList.add('on')}

document.addEventListener('submit',e=>{e.preventDefault();q=$('#q').value.trim();render()});

$('#t1').onclick=()=>{tab=1;render()};
$('#t2').onclick=()=>{tab=2;render()};

// ===== Map mit Drops =====
const TERMS=['pop','rock','hip hop','jazz','electronic','indie','r&b','latin','soul','reggae','dance','metal','country','k-pop','funk'];
const HOME=[52.52,13.405],CELL=0.005,RADIUS=50;
let map,layer,meDot,meCircle,pos=null,test=false,sel=null,drops=[],lastCell='',dropBusy=false;
const dayKey=()=>new Date().toISOString().slice(0,10);
function hashStr(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dist(a,b){const r=x=>x*Math.PI/180,p=r(b[0]-a[0]),l=r(b[1]-a[1]);const h=Math.sin(p/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(l/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))}
function mapSong(x){return{id:x.trackId,title:x.trackName,artist:x.artistName,genre:x.primaryGenreName||'Musik',year:(x.releaseDate||'').slice(0,4),cover:x.artworkUrl100.replace('100x100','600x600'),preview:x.previewUrl||''}}
function addCard(c,msg){
  if(c.r===3){
    const ah=c.title==='After Hours'&&/weeknd/i.test(c.artist);
    if(ah&&USER==='theweeknd'&&c.no===1)ED[c.id]=Math.max(ED[c.id]||0,1);
    else c.no=ED[c.id]=Math.max((ED[c.id]||0)+1,ah?2:1);
    saveED();
  }else delete c.no;
  S.cards.unshift(c);S.coins+=R[c.r].coins;save();render();showCard(c,msg)}

// Drops entstehen aus Tag + Gitterzelle: gleiche Orte zeigen allen Spielern dieselben Drops
function genDrops(center){
  const cx=Math.floor(center[0]/CELL),cy=Math.floor(center[1]/CELL),done=S.opened||[],out=[];
  for(let x=cx-1;x<=cx+1;x++)for(let y=cy-1;y<=cy+1;y++)for(let i=0;i<2;i++){
    const id=`${dayKey()}:${x}:${y}:${i}`;if(done.includes(id))continue;
    const r=rng(hashStr(id)),lat=(x+r())*CELL,lng=(y+r())*CELL,n=r()*100;
    out.push({id,lat,lng,tier:n<55?0:n<80?1:n<99.9?2:3});
  }
  (S.scans||[]).forEach(d=>{if(!done.includes(d.id))out.push(d)});
  if(USER==='theweeknd'&&(pos||test)&&!done.includes('first')){S.first=S.first||{lat:center[0]+.0002,lng:center[1]+.0002};out.push({id:'first',...S.first,tier:3,first:1})}
  return out;
}
function refreshDrops(){
  if(!map)return;
  drops=genDrops(pos||HOME);layer.clearLayers();
  drops.forEach(d=>L.marker([d.lat,d.lng],{icon:L.divIcon({className:'',html:`<div class="dropm${d.tier===3?' ep':''}" style="--c1:${gcol(d)}"><svg viewBox="0 0 24 24"><path d="M9 3v10.3A3.5 3.5 0 1 0 11 16.5V7h6V3z"/></svg></div>`,iconSize:[44,44]})}).on('click',()=>{sel=d;updateSheet()}).addTo(layer));
}
function updateSheet(){
  const s=$('#sheet');
  if(!sel){s.hidden=true;return}
  const dd=pos?Math.round(dist(pos,[sel.lat,sel.lng])):null,can=test||(dd!==null&&dd<=RADIUS),t=R[sel.tier];
  s.hidden=false;
  s.innerHTML=`<div class="dot" style="--c1:${gcol(sel)}"></div><div class="t"><b>${sel.tier===3?'Epic Drop':'Drop'} · ${dropGenre(sel)}</b><small>${dd===null?'Position wird gesucht …':dd+' m entfernt'}${can?'':`. Komm näher als ${RADIUS} m.`}</small></div><button class="btn" style="height:42px" data-drop ${can&&!dropBusy?'':'disabled'}>Öffnen</button>`;
}
function setTb(){const b=$('#tb');b.innerHTML='Test<br>'+(test?'an':'aus');b.className=test?'on':''}
function onPos(p){
  pos=[p.coords.latitude,p.coords.longitude];
  if(!meDot){
    meDot=L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);
    meCircle=L.circle(pos,{radius:RADIUS,color:'#3aa0ff',weight:1,fillOpacity:.08,interactive:false}).addTo(map);
    map.setView(pos,16);
  }else{meDot.setLatLng(pos);meCircle.setLatLng(pos)}
  const k=Math.floor(pos[0]/CELL)+':'+Math.floor(pos[1]/CELL);
  if(k!==lastCell){lastCell=k;refreshDrops()}
  updateSheet();
}
function onErr(){test=true;setTb();refreshDrops();toast('Standort nicht verfügbar. Erlaube ihn im Browser. Testmodus ist an.');updateSheet()}
function initMap(){
  if(!map){
    map=L.map('map',{zoomControl:false,attributionControl:false}).setView(HOME,16);
    L.control.attribution({position:'topleft',prefix:false}).addTo(map);
    // Für die saubere Karte (CARTO Voyager) hier den kostenlosen Key von carto.com/basemaps/apikey eintragen
    const CARTO_KEY='';
    if(!CARTO_KEY)$('#map').classList.add('osm');
    L.tileLayer(CARTO_KEY?`https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=${CARTO_KEY}`:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,detectRetina:true,attribution:CARTO_KEY?'© OpenStreetMap © CARTO':'© OpenStreetMap'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    map.on('click',()=>{sel=null;updateSheet()});loadPool();
    $('#scan').onclick=scan;
    $('#tb').onclick=()=>{test=!test;setTb();updateSheet()};
    $('#loc').onclick=()=>{if(pos)map.setView(pos,17);else toast('Position wird noch gesucht')};
    setTb();refreshDrops();
    if('geolocation' in navigator)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000});
    else onErr();
  }
  setTimeout(()=>map.invalidateSize(),0);
}
$('#t3').onclick=()=>{view=null;tab=3;render()};
// Tagesserie: +1 pro Tag, bei einem verpassten Tag zurück auf 1
(function(){const t=dayKey(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.last!==t){S.streak=S.last===y?(S.streak||0)+1:1;S.last=t;save()}})();

// ===== Top-50-Artists pro Genre (iTunes-Charts) =====
const jsonp=u=>new Promise(res=>{const cb='jp'+Math.random().toString(36).slice(2),sc=document.createElement('script');const done=v=>{delete window[cb];sc.remove();res(v)};window[cb]=done;sc.src=u+(u.includes('?')?'&':'?')+'output=jsonp&callback='+cb;sc.onerror=()=>done(null);setTimeout(()=>done(null),8000);document.head.appendChild(sc)});
// Deezer-Genre-IDs: globale Top-50-Artist-Charts pro Genre (K-Pop = Asian Music)
const GEN=[['Global Top 50',0],['Pop',132],['Hip-Hop',116],['Rock',152],['Alternative',85],['R&B',165],['Electronic',106],['Jazz',129],['Country',84],['Latin',197],['Metal',464],['Reggae',144],['Dance',113],['K-Pop',16]];
let POOL={},poolP=null;
try{POOL=JSON.parse(localStorage.getItem('drops-pool'))||{}}catch(e){}
// International: Spotify Top 50 Artists weltweit (nach Monatshörern, Stand 4.10.2026, kworb.net). Zum Aktualisieren diese Liste ersetzen.
POOL['Global Top 50']=['Bruno Mars','Rihanna','The Weeknd','Justin Bieber','Taylor Swift','Lady Gaga','Coldplay','Drake','Bad Bunny','Ariana Grande','Shakira','Katy Perry','Michael Jackson','David Guetta','Maroon 5','Ed Sheeran','Pitbull','Billie Eilish','Dua Lipa','Calvin Harris','Eminem','J Balvin','Kendrick Lamar','Kanye West','Sia','KAROL G','Post Malone','Olivia Rodrigo','SZA','Lana Del Rey','Beyoncé','Black Eyed Peas','Daddy Yankee','Harry Styles','Miley Cyrus','Travis Scott','Tame Impala','Sean Paul','Adele','Justin Timberlake','Linkin Park','Shawn Mendes','Chris Brown','Shreya Ghoshal','Arctic Monkeys','Marshmello','Ellie Goulding','Madonna','Doja Cat','Zara Larsson'];
const prim=n=>n.split(/ (?:&|feat\.?|ft\.?|x) |, /i)[0].trim();
function loadPool(){
  return poolP||(poolP=Promise.all(GEN.filter(g=>!(POOL[g[0]]||[]).length).map(async([n,id])=>{
    const j=await jsonp(`https://api.deezer.com/chart/${id}/artists?limit=50`),l=((j&&j.data)||[]).map(x=>x.name);
    if(l.length)POOL[n]=l.slice(0,50);
  })).then(()=>{try{localStorage.setItem('drops-pool',JSON.stringify(POOL))}catch(e){}}));
}

// ===== Scan: neue Drops im Umkreis =====
const SCAN_R=150,SCAN_CD=30000;let scanAt=0,scanning=false;
function scan(){
  const w=SCAN_CD-(Date.now()-scanAt);
  if(scanning)return;
  if(w>0){toast(`Scanner lädt noch ${Math.ceil(w/1000)} s`);return}
  scanning=true;scanAt=Date.now();$('#scan').classList.add('cd');
  const c=pos||[map.getCenter().lat,map.getCenter().lng];
  const ring=L.circle(c,{radius:5,color:'#2ee08a',weight:2,fillOpacity:.15,interactive:false}).addTo(map);
  let t=0;const iv=setInterval(()=>{t+=1/30;ring.setRadius(5+t*SCAN_R);ring.setStyle({opacity:1-t,fillOpacity:.15*(1-t)});
    if(t>=1){clearInterval(iv);map.removeLayer(ring);finishScan(c)}},33);
  setTimeout(()=>$('#scan').classList.remove('cd'),SCAN_CD);
}
function finishScan(c){
  const n=3+Math.floor(Math.random()*3),add=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,d=20+Math.random()*(SCAN_R-20),k=Math.random()*100;
    add.push({id:`scan:${Date.now()}:${i}`,lat:c[0]+Math.sin(a)*d/111320,lng:c[1]+Math.cos(a)*d/(111320*Math.cos(c[0]*Math.PI/180)),tier:k<50?0:k<78?1:k<99.9?2:3});
  }
  S.scans=(S.scans||[]).concat(add).slice(-40);save();refreshDrops();scanning=false;
  toast(`${n} neue Drops gefunden`);
}

// ===== Ganze Discography: zufälliges Album des Artists, daraus ein zufälliger Song =====
const DC={};
const jg=async u=>(await(await fetch(u)).json()).results||[];
async function discoSong(a,rnd,own){
  if(!DC[a]){
    const ar=await jg(`https://itunes.apple.com/search?term=${encodeURIComponent(a)}&entity=musicArtist&limit=5&country=us`),m=ar.find(x=>x.artistName.toLowerCase()===a.toLowerCase())||ar[0];
    if(!m)return null;
    DC[a]=(await jg(`https://itunes.apple.com/lookup?id=${m.artistId}&entity=album&limit=200&country=us`)).filter(x=>x.wrapperType==='collection'&&x.collectionId);
  }
  const albs=DC[a].slice();
  for(let n=0;n<6&&albs.length;n++){
    const al=albs.splice(Math.floor(rnd()*albs.length),1)[0];
    const tr=(await jg(`https://itunes.apple.com/lookup?id=${al.collectionId}&entity=song&country=us`)).filter(x=>x.wrapperType==='track'&&x.kind==='song'&&x.trackId&&x.artworkUrl100&&!own.has(x.trackId)&&x.artistName.toLowerCase().includes(a.toLowerCase()));
    if(tr.length)return mapSong(tr[Math.floor(rnd()*tr.length)]);
  }
  return null;
}
// ===== Drop öffnen (Artist aus den Top 50 des Genres; Legendär = Top 5, Episch = Top 15 …) =====
async function openDrop(){
  const d=sel;if(!d||dropBusy)return;
  dropBusy=true;updateSheet();
  try{
    const r=rng(hashStr(d.id+'s')),own=new Set(S.cards.map(c=>c.id));let s,top=0;
    if(d.first){
      const j=await(await fetch('https://itunes.apple.com/search?term=the+weeknd+after+hours&entity=song&limit=25&country=de')).json();
      s=j.results.find(x=>x.trackName==='After Hours'&&/weeknd/i.test(x.artistName));
      if(!s)throw 0;s=mapSong(s);
    }else{
      await loadPool();
      const g=GEN[Math.floor(r()*GEN.length)][0],lst=POOL[g]||[],i=Math.floor(r()*Math.min([50,30,15,5][d.tier],lst.length||1)),a=lst[i];
      if(!a){toast('Artists werden geladen. Versuch es gleich nochmal.');return}
      s=await discoSong(a,r,own);
      if(!s){toast('Dieser Drop ist leer');return}
      top=i+1;
    }
    if(own.has(s.id)){toast('Diesen Song hast du schon');return}
    const c={...s,r:d.first?3:await rarOf(s.artist,d.tier),at:Date.now(),no:d.first?1:0,top};
    S.opened=(S.opened||[]).concat(d.id).slice(-300);
    sel=null;
    addCard(c,d.first?`Dein erster Drop: ${c.title} #1! +${R[c.r].coins} Münzen`:`Drop geöffnet! +${R[c.r].coins} Münzen`);
    refreshDrops();
  }catch(e){toast('Drop konnte nicht geöffnet werden. Versuch es nochmal.')}
  finally{dropBusy=false;updateSheet()}
}

// Öffentlicher Schlüssel: prüft Gutscheine. Der private Schlüssel liegt nur bei dir und steht nie in dieser Datei.
const PUB={kty:'EC',crv:'P-256',x:'kCRTl9x1z89pZ_-Dpo-1paU8VkmF3-TQ8EmcGYVYfeI',y:'ajsUD8unBm_9U6EIVbNeysVbLJ9lLY0HXMWjlo7GC0g'},EC={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const isAdm=()=>{try{return USER==='theweeknd'&&!!localStorage.getItem('drops-adm')}catch(e){return false}};
async function signWith(d,txt){const k=await crypto.subtle.importKey('jwk',{...PUB,d},EC,false,['sign']);return crypto.subtle.sign(SG,k,new TextEncoder().encode(txt))}
async function verTxt(txt,sig){const k=await crypto.subtle.importKey('jwk',PUB,EC,false,['verify']);return crypto.subtle.verify(SG,k,sig,new TextEncoder().encode(txt))}
async function admOK(d){try{return await verTxt('ok',await signWith(d,'ok'))}catch(e){return false}}

  aLog(`<b>&gt; ${esc(line)}</b>`);
  try{
    const [w0,...rest]=line.split(/\s+/),w=w0.toLowerCase(),arg=rest.join(' '),A=ACC(),has=k=>k===USER||!!A[k],cnt=k=>(store(k).cards||[]).length;
    if(w==='help'){aLog(`<div class="cmds">${esc(CMDS)}</div>`)}
    else if(w==='users'){aLog(Object.keys(A).map(k=>`${esc(A[k].n)}: ${cnt(k)} Karten, ${k===USER?'∞':(ud(k).coins||0)} Münzen`).join('<br>')||'Keine',)}
    else if(w==='stats'){const ks=Object.keys(A),all=ks.flatMap(k=>store(k).cards||[]);aLog(`${ks.length} Accounts, ${all.length} Karten, ${all.filter(c=>c.r===3).length} Epic`)}
    else if(w==='inv'){const k=arg.toLowerCase();if(!has(k))throw 'User nicht auf diesem Gerät';aLog((store(k).cards||[]).slice(0,40).map(c=>`${esc(c.title)} (${esc(c.artist)}) ${R[c.r].n}${c.no?' #'+c.no:''}`).join('<br>')||'Leer')}
    else if(w==='clear'||w==='take'){
      const m=w==='clear'?[0,arg]:arg.match(/^(\S+)\s+-\s+(.+)$/);if(!m)throw 'Format: take user - Titel';
      const k=String(m[1]).toLowerCase();if(!has(k))throw 'User nicht auf diesem Gerät';
      const st=store(k),n0=(st.cards||[]).length,q=w==='clear'?'':m[2].toLowerCase();
      st.cards=(st.cards||[]).filter(c=>w==='clear'?false:!c.title.toLowerCase().includes(q));st.show=(st.show||[]).filter(id=>st.cards.some(c=>c.id===id));
      wr(k,st);aLog(`${n0-st.cards.length} Karte(n) entfernt`,'ok');if(k===USER)render();
    }
    else if(w==='drop'){
      const t=RN[arg.toLowerCase()??'epic']??3,c=pos||HOME;
      S.scans=(S.scans||[]).concat({id:'adm:'+Date.now(),lat:c[0]+.0002,lng:c[1]+.0002,tier:t}).slice(-40);save();if(map)refreshDrops();aLog(`${R[t].n}-Drop auf der Map platziert`,'ok');
    }
    else if(w==='coins'){
      const m=arg.match(/^(\S+)\s+([+\-=]?)(\d+)$/);if(!m)throw 'Format: coins user +500';
      const k=m[1].toLowerCase(),o=m[2]||'+',v=+m[3],f=x=>o==='='?v:o==='-'?Math.max(0,x-v):x+v;
      if(has(k)){const st=store(k);st.coins=f(st.coins||0);wr(k,st);aLog(`${esc(k)} hat jetzt ${st.coins} Münzen`,'ok');if(k===USER)render()}
      else{const u=await mkLink({k:'$',to:k,v,o});aLog(`Gutschein für ${esc(k)}: <button class="btn" style="height:36px" data-copy="${esc(u)}">Link teilen</button>`,'ok')}
    }
    else{
      const force=w==='link',src=force?arg:line,m=src.match(/^(\S+)\s+-\s+(.+)$/);
      if(!m)throw 'Unbekannter Command. Tippe help.';
      const k=m[1].toLowerCase();let q=m[2].trim(),r=3,no=0;
      const nm=q.match(/\s+#(\d+)$/);if(nm){no=+nm[1];q=q.slice(0,nm.index)}
      const rm=q.match(/\s+(common|uncommon|rare|epic)$/i);if(rm){r=RN[rm[1].toLowerCase()];q=q.slice(0,rm.index)}
      const s=await findSong(q);if(!s)throw 'Song nicht gefunden';
      no=r===3?(no||(ED[s.id]||0)+1):0;
      const c={...s,r,at:Date.now()};if(no)c.no=no;
      const lbl=`${esc(s.title)} (${esc(s.artist)}) ${R[r].n}${no?' #'+no:''}`;
      if(!force&&has(k)){const st=store(k);put(st,c);wr(k,st);aLog(`${lbl} an ${esc(k)} gegeben`,'ok');if(k===USER){render();showCard(c,'Admin-Spawn')}}
      else{if(no){ED[s.id]=Math.max(ED[s.id]||0,no);saveED()}const u=await mkLink({k:'c',to:k,id:s.id,r,no});aLog(`${lbl}: Gutschein für ${esc(k)} <button class="btn" style="height:36px" data-copy="${esc(u)}">Link teilen</button>`,'ok')}
    }
  }catch(e){aLog(esc(typeof e==='string'?e:'Fehler. Prüfe Verbindung und Format.'),'er')}
}
// Gutschein einlösen: #g=<Daten>.<Signatur>, geprüft mit dem öffentlichen Schlüssel
async function loadGift(){
  const m=location.hash.match(/^#g=(.+)\.(.+)$/);if(!m)return;
  history.replaceState(null,'',location.pathname);
  try{
    if(!await verTxt(m[1],unb(m[2]))){toast('Ungültiger Gutschein');return}
    const g=JSON.parse(new TextDecoder().decode(unb(m[1])));
    if(g.to!==USER){toast(`Dieser Gutschein ist für ${g.to}`);return}
    S.red=S.red||[];if(S.red.includes(g.n)){toast('Gutschein schon eingelöst');return}
    if(g.k==='$'){S.coins=g.o==='='?g.v:g.o==='-'?Math.max(0,S.coins-g.v):S.coins+g.v;S.red.push(g.n);save();render();toast('Münzen erhalten');return}
    const x=(await jg(`https://itunes.apple.com/lookup?id=${g.id}&country=us`)).find(y=>y.trackId);if(!x)throw 0;
    const c={...mapSong(x),r:g.r,at:Date.now()};if(g.no)c.no=g.no;
    put(S,c);S.red.push(g.n);save();render();showCard(c,'Geschenk erhalten!');
  }catch(e){toast('Gutschein konnte nicht eingelöst werden')}
}
// ===== Quicksell =====
const QS=[10,25,60,200];
function quick(id){
  const c=S.cards.find(x=>x.id===id);if(!c)return;
  const v=QS[c.r];
  if(c.r===3&&!confirm(`Epic „${c.title}“${c.no?' #'+c.no:''} wirklich für ${v} Münzen verkaufen?`))return;
  S.cards=S.cards.filter(x=>x.id!==id);S.show=(S.show||[]).filter(x=>x!==id);S.coins+=v;
  setMkt(mkt().filter(x=>!(x.seller===USER&&x.c.id===id)));
  save();$('#ov').classList.remove('on');render();toast(`+${v} Münzen`);
}
// ===== Inventar: Suche, Sortierung, Seltenheits-Filter =====
let iq='',isort='new',irar=-1;
const SORTS=[['new','Neueste'],['rar','Seltenheit'],['art','Artist A–Z'],['ttl','Titel A–Z'],['no','Epic-Nr.']];
function invGrid(){
  const qq=iq.toLowerCase(),big=9e9;
  const cmp={new:(a,b)=>(b.at||0)-(a.at||0),rar:(a,b)=>b.r-a.r||(a.no||big)-(b.no||big),art:(a,b)=>a.artist.localeCompare(b.artist)||a.title.localeCompare(b.title),ttl:(a,b)=>a.title.localeCompare(b.title),no:(a,b)=>(a.no||big)-(b.no||big)}[isort];
  const l=S.cards.filter(c=>(irar<0||c.r===irar)&&(!qq||(c.artist+' '+c.title).toLowerCase().includes(qq))).sort(cmp);
  return l.length?`<div class="grid">${l.map(c=>cardHTML(c,true)).join('')}</div>`:'<p class="empty">Keine Karten gefunden.</p>';
}
function invHTML(){
  if(!S.cards.length)return '<p class="empty">Noch keine Karten. Öffne Drops auf der Map oder Boxen im Shop.</p>';
  return `<input id="iq" type="search" placeholder="Artist oder Song suchen" value="${esc(iq)}" autocomplete="off">
  <div class="chs">${SORTS.map(([k,n])=>`<button class="chip${isort===k?' on':''}" data-sort="${k}">${n}</button>`).join('')}</div>
  <div class="chs">${['Alle',...R.map(r=>r.n)].map((n,i)=>`<button class="chip${irar===i-1?' on':''}" data-irar="${i-1}">${n}</button>`).join('')}</div>
  <div id="ig">${invGrid()}</div>`;
}
document.addEventListener('input',e=>{if(e.target.id==='iq'){iq=e.target.value;$('#ig').innerHTML=invGrid()}});

// ===== Minigames =====
$('#t6').onclick=()=>{tab=6;G=null;render()};
const GG=[['Pop','pop'],['Rock','rock'],['Hip-Hop','hip hop'],['Electronic','electronic'],['R&B','r&b'],['Latin','latin'],['Metal','metal'],['Country','country']];
const DIF={Easy:[1,2,4,8,15],Normal:[.1,.5,2,8,15],Hard:[.1,.3,1,3,8]},GREW=[25,18,12,8,5];
const QZ={cover:['Cover-Raten','Welcher Song gehört zu diesem Cover?'],artist:['Wer singt’s?','Höre rein und wähle den Artist.'],year:['Jahr-Raten','Aus welchem Jahr ist dieser Song?']};
let G=null,gdif='Normal',ggen='Pop',gaud=null,gtm=0,gsq=0;
const rnd=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const gstop=()=>{clearTimeout(gtm);if(gaud)gaud.pause()};
const gload=u=>{gstop();gaud=new Audio(u);gaud.preload='auto'};
function gclip(len){if(!gaud)return;gstop();gaud.currentTime=0;gaud.play().catch(()=>toast('Vorschau nicht verfügbar'));gtm=setTimeout(gstop,len*1000)}
function gcoin(n){S.coins+=n;save();$('#coins').textContent=USER==='theweeknd'?'∞':S.coins}
async function gPool(terms){
  const seen=new Set(),out=[];
  for(const t of terms)try{(await jg(`https://itunes.apple.com/search?term=${encodeURIComponent(t)}&entity=song&limit=60&country=us`)).forEach(x=>{if(x.trackId&&x.previewUrl&&x.artworkUrl100&&x.releaseDate&&!seen.has(x.trackName)){seen.add(x.trackName);out.push(mapSong(x))}})}catch(e){}
  return out;
}
const chips=(l,cur,at)=>`<div class="chs">${l.map(n=>`<button class="chip${n===cur?' on':''}" ${at}="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
function gamesRender(){
  const m=$('#main'),back='<button class="ghost" style="width:auto;padding:0 14px;margin-bottom:12px" data-gb>← Spiele</button>';
  if(!G){m.innerHTML=`<h2 style="font-size:30px;font-weight:800">Spiele</h2><p class="gs">Spiele Minigames und verdiene Münzen.</p><div class="gcards">${[['song','🎧','Songspot','Errate den Song aus 0,1 Sekunden'],['mem','🃏','Album-Memory','Finde die Album-Paare'],['cover','🖼️','Cover-Raten','Unscharfes Cover, welcher Song?'],['artist','🎤','Wer singt’s?','Clip hören, Artist wählen'],['year','📅','Jahr-Raten','Aus welchem Jahr ist der Song?']].map(([k,i,n,d])=>`<button class="gc" data-gm="${k}"><span style="font-size:30px">${i}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div>`;return}
  if(G.busy){m.innerHTML=back+'<p class="empty">Lädt …</p>';return}
  m.innerHTML=back+(G.k==='song'?songHTML():G.k==='mem'?memHTML():quizHTML());
}
// --- Songspot
function songHTML(){
  if(G.cfg)return `<div class="gh"><span>CLIP CHALLENGE</span></div><p class="gt">Errate den Song.</p><p class="gs">Starte mit 0,1 Sekunden. Suche den Titel, um zu antworten.</p>
  <div class="gh" style="margin-top:20px"><span>SCHWIERIGKEIT</span></div>${chips(Object.keys(DIF),gdif,'data-gd')}
  <div class="gh" style="margin-top:14px"><span>GENRE</span></div>${chips(GG.map(x=>x[0]),ggen,'data-gg')}
  <button class="btn big" style="margin-top:18px" data-gstart>Spiel starten</button>`;
  const L=G.len,st=G.st,last=L[L.length-1],s=G.s;
  const wf=`<div class="wf">${[...Array(44)].map((_,i)=>`<i class="${i/44*last<=L[st]?'on':''}" style="height:${25+Math.abs(Math.sin(i*1.7)*Math.cos(i*.6))*75}%"></i>`).join('')}</div>`;
  const head=`<div class="gh"><span>CLIP CHALLENGE</span><span>${gdif.toUpperCase()}</span></div><div class="stg">${L.map((x,i)=>`<span class="${i===st?'on':''}">${x}s</span>`).join('')}</div>${wf}`;
  if(G.done)return head+`<img class="gv" src="${esc(s.cover)}" alt=""><p class="gt">${esc(s.title)}</p><p class="gs">${esc(s.artist)} · ${esc(s.year)}</p><p class="gs" style="color:${G.win?'var(--go)':'#ff6b6b'}">${G.win?`Richtig! +${G.c} Münzen`:'Leider nicht erraten.'}</p><button class="btn big" data-gn>Nächster Song</button>`;
  return head+`<button class="btn big" data-gp>▶ Clip abspielen (${L[st]}s)</button>${G.wr.map(t=>`<div class="mo no"><b>✕</b>${esc(t)}</div>`).join('')}
  <input id="gq" placeholder="Nach einem Song suchen …" autocomplete="off" style="width:100%;flex:none"><div id="sug"></div>
  <button class="skip" data-gs>Skip${st<L.length-1?` (+${+(L[st+1]-L[st]).toFixed(1)}s)`:''}</button>`;
}
async function songStart(){
  G={k:'song',busy:1};gamesRender();
  const l=await gPool([GG.find(x=>x[0]===ggen)[1]]);
  if(!l.length){G=null;toast('Songs konnten nicht geladen werden');gamesRender();return}
  const s=rnd(l);gload(s.preview);G={k:'song',s,st:0,done:0,win:0,wr:[],len:DIF[gdif]};gamesRender();
}
function songEnd(win){G.done=1;G.win=win;gstop();if(win){G.c=GREW[G.st];gcoin(G.c)}gamesRender();if(gaud){gaud.currentTime=0;gaud.play().catch(()=>{})}}
function songNext(){G.st++;gamesRender();gclip(G.len[G.st])}
function songGuess(id,t,a){
  const s=G.s,nm=x=>x.toLowerCase().replace(/\(.*?\)|\[.*?\]|\s-\s.*$/g,'').replace(/[^a-z0-9]/g,'');
  if(id===s.id||(nm(t)===nm(s.title)&&nm(prim(a)).slice(0,6)===nm(prim(s.artist)).slice(0,6)))return songEnd(1);
  G.wr.push(t);if(G.st>=G.len.length-1)return songEnd(0);songNext();
}
document.addEventListener('input',e=>{
  if(e.target.id!=='gq')return;const v=e.target.value.trim(),id=++gsq;
  if(v.length<2){$('#sug').innerHTML='';return}
  setTimeout(async()=>{if(id!==gsq)return;try{const r=(await jg(`https://itunes.apple.com/search?term=${encodeURIComponent(v)}&entity=song&limit=6&country=us`)).filter(x=>x.trackId);
    if(id===gsq&&$('#sug'))$('#sug').innerHTML=r.map(x=>`<button class="sgi" data-gx="${x.trackId}" data-gt="${esc(x.trackName)}" data-ga="${esc(x.artistName)}"><b>${esc(x.trackName)}</b> · ${esc(x.artistName)}</button>`).join('')}catch(err){}},250);
});
// --- Album-Memory
async function memStart(){
  G={k:'mem',busy:1};gamesRender();
  const seen=new Set(),al=[];
  for(const t of shuf(TERMS).slice(0,2))try{(await jg(`https://itunes.apple.com/search?term=${encodeURIComponent(t)}&entity=album&limit=40&country=us`)).forEach(x=>{if(x.artworkUrl100&&!seen.has(x.artworkUrl100)){seen.add(x.artworkUrl100);al.push(x.artworkUrl100.replace('100x100','300x300'))}})}catch(e){}
  if(al.length<6){G=null;toast('Alben konnten nicht geladen werden');gamesRender();return}
  G={k:'mem',c:shuf(shuf(al).slice(0,6).flatMap(u=>[u,u])),open:[],done:new Set(),mv:0,lock:0,win:0};gamesRender();
}
function memHTML(){
  return `<div class="gh"><span>ALBUM-MEMORY</span><span>Züge: ${G.mv}</span></div>${G.win?`<p class="gt">Geschafft!</p><p class="gs">${G.mv} Züge · +${G.win} Münzen</p>`:''}<div class="mem">${G.c.map((u,i)=>{const f=G.open.includes(i)||G.done.has(i);return `<button class="mc${G.done.has(i)?' up':''}" data-mc="${i}">${f?`<img src="${esc(u)}" alt="">`:'?'}</button>`}).join('')}</div>${G.win?'<button class="btn big" style="margin-top:16px" data-gm="mem">Nochmal spielen</button>':''}`;
}
function memTap(i){
  if(G.lock||G.open.includes(i)||G.done.has(i))return;
  G.open.push(i);
  if(G.open.length===2){G.mv++;const[a,b]=G.open;
    if(G.c[a]===G.c[b]){G.done.add(a);G.done.add(b);G.open=[];if(G.done.size===G.c.length){G.win=Math.max(5,30-G.mv*2);gcoin(G.win)}}
    else{const g=G;g.lock=1;gamesRender();setTimeout(()=>{g.open=[];g.lock=0;if(G===g)gamesRender()},800);return}}
  gamesRender();
}
// --- Quiz: Cover / Artist / Jahr
async function quizStart(k){
  G={k:'quiz',busy:1};gamesRender();
  const l=await gPool(shuf(TERMS).slice(0,3));
  if(l.length<12){G=null;toast('Songs konnten nicht geladen werden');gamesRender();return}
  const yr=new Date().getFullYear(),qs=shuf(l).slice(0,8).map(s=>{
    const a=k==='cover'?s.title:k==='artist'?s.artist:s.year;
    const o=k==='cover'?l.filter(x=>x.title!==s.title).map(x=>x.title):k==='artist'?[...new Set(l.map(x=>x.artist))].filter(x=>x!==s.artist):[-3,-2,-1,1,2,3,4].map(d=>String(+s.year+d)).filter(v=>+v<=yr);
    return{s,a,o:shuf([a,...shuf(o).slice(0,3)])}});
  G={k:'quiz',q:k,qs,i:0,sc:0,pk:null};qLoad();gamesRender();
}
const qLoad=()=>{if(G.q==='artist'&&G.qs[G.i])gload(G.qs[G.i].s.preview)};
function quizHTML(){
  const k=G.q,n=G.qs.length;
  if(G.i>=n)return `<div class="gh"><span>${QZ[k][0].toUpperCase()}</span></div><p class="gt">${G.sc}/${n} richtig</p><p class="gs">+${G.sc*3} Münzen verdient</p><button class="btn big" data-gm="${k}">Nochmal spielen</button>`;
  const q=G.qs[G.i],pk=G.pk;
  return `<div class="gh"><span>${QZ[k][0].toUpperCase()} · ${G.i+1}/${n}</span><span>${G.sc} ✓</span></div>
  ${k==='artist'?'<button class="btn big" data-gp2>▶ Clip abspielen</button>':`<img class="gv" src="${esc(q.s.cover)}" alt="" ${k==='cover'&&pk===null?'style="filter:blur(26px)"':''}>`}
  <p class="gs">${k==='year'?esc(q.s.title)+' · '+esc(q.s.artist):k==='artist'&&pk!==null?esc(q.s.title):QZ[k][1]}</p>
  ${q.o.map((o,j)=>`<button class="mo${pk!==null?(o===q.a?' ok':o===pk?' no':''):''}" data-mo="${esc(o)}"><b>${'ABCD'[j]}</b>${esc(o)}</button>`).join('')}
  ${pk!==null?`<button class="btn big" data-gn2>${G.i+1<n?'Weiter':'Ergebnis'}</button>`:''}`;
}
function quizPick(o){if(G.pk!==null)return;G.pk=o;if(o===G.qs[G.i].a){G.sc++;gcoin(3)}gamesRender()}
document.addEventListener('click',e=>{
  if(tab!==6)return;const t=e.target,d=a=>t.closest('['+a+']');let x;
  if(x=d('data-gm')){const k=x.dataset.gm;if(k==='song'){G={k:'song',cfg:1};gamesRender()}else if(k==='mem')memStart();else quizStart(k);return}
  if(d('data-gb')){gstop();gaud=null;G=null;gamesRender();return}
  if(x=d('data-gd')){gdif=x.dataset.gd;gamesRender();return}
  if(x=d('data-gg')){ggen=x.dataset.gg;gamesRender();return}
  if(d('data-gstart')||d('data-gn')){songStart();return}
  if(d('data-gp')){gclip(G.len[G.st]);return}
  if(d('data-gp2')){gclip(8);return}
  if(x=d('data-gx')){songGuess(+x.dataset.gx,x.dataset.gt,x.dataset.ga);return}
  if(d('data-gs')){G.st>=G.len.length-1?songEnd(0):songNext();return}
  if(x=d('data-mc')){memTap(+x.dataset.mc);return}
  if(x=d('data-mo')){quizPick(x.dataset.mo);return}
  if(d('data-gn2')){gstop();G.i++;G.pk=null;qLoad();gamesRender()}
});

if(USER){if(USER==='theweeknd')S.coins=1e9;if(!S.v2){S.cards.forEach(c=>{if(!(c.no===1&&c.title==='After Hours')){if(c.r===3)c.r=2;delete c.no}});S.v2=1;save()}if(!S.init){S.init=1;if(!S.cards.length)S.coins+=200;S.name=S.name||ACC()[USER].n;save()}render();loadShared();loadGift()}else authUI();
</script>
