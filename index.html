.frame.ep[data-r="1"]{--stops:#e04bff,#6a2bff,#e04bff,#6a2bff,#e04bff;--hi:#fff0ff}
.frame.ep[data-r="2"]{--stops:#ff3d3d,#ffb627,#2ee08a,#3aa0ff,#b06bff,#ff3d81,#ff3d3d;--hi:#fff}
.frame.ep[data-r="3"]{--stops:#ff3d81,#3aa0ff,#ff3d81,#3aa0ff,#ff3d81;--hi:#ffe6f0}
.frame.ep::before,.frame.ep::after{content:'';position:absolute;z-index:-1;pointer-events:none;border-radius:var(--er)}
.frame.ep::before{inset:-5px;background:conic-gradient(from var(--a),var(--stops));filter:blur(11px);animation:spin 6s linear infinite,gpulse 2.6s ease-in-out infinite}
.frame.ep::after{inset:-2px;background:conic-gradient(from var(--a),transparent 0 78%,var(--hi) 90%,transparent 100%),conic-gradient(from var(--a),var(--stops));animation:spin 6s linear infinite reverse}
#ov .frame.ep{width:min(92vw,400px,calc((100dvh - 240px)*.645));animation:flip .7s cubic-bezier(.2,.8,.2,1)}
#ov .frame.ep[data-r="2"],#ov .frame.ep[data-r="3"]{animation:epicspin 1.5s cubic-bezier(.2,.8,.2,1)}
.frame.ep .card.epic{aspect-ratio:1080/1675;border-radius:var(--er);container-type:inline-size}
.frame.ep .card.epic .shade{background:linear-gradient(transparent 55%,rgba(0,0,0,.55) 74%,rgba(0,0,0,.94) 100%)}
.frame.ep .card.epic .info{left:9.2cqw;right:9.2cqw;bottom:7.9cqw}
.frame.ep .card.epic .info h3{font-size:5.8cqw;line-height:1.1;font-weight:800;margin:0 0 2.4cqw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frame.ep .card.epic .info p{font-size:4.6cqw;line-height:1.2;font-weight:600;color:rgba(255,255,255,.72);margin:0 11cqw 3.2cqw 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame.ep .card.epic .chips{display:flex;flex-wrap:nowrap;gap:2.2cqw;margin-left:-1.1cqw}
.frame.ep .card.epic .chip{display:inline-flex;align-items:center;gap:1.1cqw;flex:none;height:7.4cqw;padding:0 2.7cqw;border-radius:99px;font-size:3.6cqw;font-weight:800;line-height:1;white-space:nowrap;backdrop-filter:none;-webkit-backdrop-filter:none}
.frame.ep .card.epic .chip svg{width:3.5cqw;height:3.5cqw;flex:none}
.frame.ep .card.epic .chip.rar{background:linear-gradient(100deg,var(--c1),var(--c2));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 0 2.4cqw -.4cqw var(--c1)}
.frame.ep[data-r="2"] .card.epic .chip.rar,.frame.ep[data-r="3"] .card.epic .chip.rar{animation:chue 6s linear infinite}
.frame.ep .card.epic .chip.gen{background:#06173f;color:#2f80ff;flex:0 1 auto;min-width:0}
.frame.ep .card.epic .chip.gen span{overflow:hidden;text-overflow:ellipsis}
.frame.ep .card.epic .chip.cnt{background:rgba(58,58,60,.78);color:#a4a4a8}
.frame.ep .card.epic .play{top:auto;left:auto;right:5.4cqw;bottom:14.8cqw;width:12cqw;height:12cqw;padding:0;border:0;border-radius:50%;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:rgba(255,255,255,.72);display:grid;place-items:center}
.frame.ep .card.epic .play svg{width:6.2cqw;height:6.2cqw;fill:currentColor}
.frame.ep .card.epic .no{left:auto;right:5cqw;top:5.3cqw;font-size:3.9cqw;line-height:1.2;font-weight:800;padding:1cqw 3.2cqw;background:#fff;color:#000}
@media (prefers-reduced-motion:reduce){.frame.ep::before,.frame.ep::after,.frame.ep .chip.rar{animation:none!important}}
/* ===== Glow-Feinschliff nach Video: stärker, mit hellem Lauflicht und Puls ===== */
@keyframes gbeat{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
@keyframes rbh{0%,100%{box-shadow:0 0 38px -2px rgba(255,61,61,.6)}17%{box-shadow:0 0 38px -2px rgba(255,182,39,.6)}33%{box-shadow:0 0 38px -2px rgba(46,224,138,.6)}50%{box-shadow:0 0 38px -2px rgba(58,160,255,.6)}67%{box-shadow:0 0 38px -2px rgba(176,107,255,.6)}83%{box-shadow:0 0 38px -2px rgba(255,61,129,.6)}}
.frame.ep{--gh:rgba(46,224,138,.55);box-shadow:0 0 38px -2px var(--gh)}
.frame.ep[data-r="1"]{--gh:rgba(176,107,255,.6)}
.frame.ep[data-r="3"]{--gh:rgba(255,61,129,.55)}
.frame.ep[data-r="2"]{animation:rbh 6s linear infinite}
#ov .frame.ep[data-r="2"]{animation:epicspin 1.5s cubic-bezier(.2,.8,.2,1),rbh 6s linear 1.5s infinite}
.frame.ep::before{inset:-9px;filter:blur(16px) saturate(1.5) brightness(1.15);animation:spin 5s linear infinite,gbeat 2.4s ease-in-out infinite}
.frame.ep::after{inset:-3px;background:conic-gradient(from var(--a),transparent 0 60%,var(--hi) 86%,#fff 92%,transparent 100%),conic-gradient(from var(--a),var(--stops));animation:spin 4s linear infinite reverse}
@media (prefers-reduced-motion:reduce){.frame.ep[data-r="2"]{animation:none}}
/* ===== Glow nur bei nummerierten Epics (Stufen Common/Uncommon/Rare), normale Songs nur Schimmer ===== */
.frame.ep[data-t="0"]{--stops:#2ee08a,#14a361,#9bffc8,#14a361,#2ee08a;--hi:#eafff3;--gh:rgba(46,224,138,.55)}
.frame.ep[data-t="1"]{--stops:#b06bff,#6a2bff,#e0b8ff,#6a2bff,#b06bff;--hi:#f6ecff;--gh:rgba(176,107,255,.6)}
.frame.ep[data-t="2"]{--stops:#ffb627,#ff7a1a,#ffe39a,#ff7a1a,#ffb627;--hi:#fff8e6;--gh:rgba(255,182,39,.6)}
.frame.ep[data-r] .card.epic .chip.rar{animation:none}
.frame.ep.flat{box-shadow:none!important;animation:none}
#ov .frame.ep.flat{animation:flip .7s cubic-bezier(.2,.8,.2,1)}
.frame.ep.flat::before{display:none}
.frame.ep.flat::after{inset:-1.5px;animation:none;background:linear-gradient(150deg,color-mix(in srgb,var(--c1) 75%,transparent),color-mix(in srgb,var(--c2) 22%,transparent) 55%,color-mix(in srgb,var(--c1) 55%,transparent))}
.frame.ep.flat .card.epic::after,.frame.flat:not(.ep) .card::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--c1) 32%,transparent) 50%,transparent 60%);transform:translateX(-130%);animation:shimmer 7s ease-in-out infinite}
.frame.flat .card.vid::after{display:none}
.frame.flat:not(.ep){background:color-mix(in srgb,var(--c1) 40%,#1b1c21);box-shadow:none;animation:none}
.grid>.frame.flat:nth-child(even) .card::after{animation-delay:-3.5s}
.tile{box-shadow:none}
.tile[data-r="3"]{animation:none;box-shadow:0 0 18px -2px var(--c1)}
.tile:not([data-r="3"]):not([data-r="4"])::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--c1) 30%,transparent) 50%,transparent 60%);transform:translateX(-130%);animation:shimmer 7s ease-in-out infinite}
/* ===== Profil: Collection-Liste ===== */
.coll{padding:14px 18px 8px;background:#3d0206;border-radius:26px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.ct span{font-size:14px;font-weight:500;opacity:.85;margin-top:2px}
.pl{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:4px 11px 4px 9px;border-radius:99px;font-size:13px;font-weight:600;font-style:normal;color:var(--c1);background:rgba(0,0,0,.4);background:color-mix(in srgb,var(--c1) 16%,#000)}
.cp{flex:none;width:44px;height:44px;border:0;background:none;color:#ff4a4a;display:grid;place-items:center}
.crow.pin{outline:2px solid var(--go);outline-offset:-2px;border-radius:16px}
.crow[data-t="0"]{--s:#2ee08a,#14a361,#9bffc8,#14a361,#2ee08a}
.crow[data-t="1"]{--s:#b06bff,#6a2bff,#e0b8ff,#6a2bff,#b06bff}
.crow[data-t="2"]{--s:#ffb627,#ff7a1a,#ffe39a,#ff7a1a,#ffb627}
.crow.glow .cv::before,.crow.glow .cv::after{content:'';position:absolute;z-index:-1;pointer-events:none}
.crow.glow .cv::before{inset:-5px;border-radius:18px;background:conic-gradient(from var(--a),var(--s));filter:blur(9px) saturate(1.5) brightness(1.15);animation:spin 5s linear infinite,gbeat 2.4s ease-in-out infinite}
.crow.glow .cv::after{inset:-2px;border-radius:15px;background:conic-gradient(from var(--a),var(--s));animation:spin 4s linear infinite reverse}
.crow.flat .cv{overflow:hidden;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c1) 38%,transparent)}
.crow.flat .cv::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--c1) 38%,transparent) 50%,transparent 60%);transform:translateX(-130%);animation:shimmer 7s ease-in-out infinite}
.crow:nth-child(odd) .cv::after{animation-delay:-3.5s}
/* ===== Map (überarbeitet) ===== */
#map{z-index:0;background:#161616}
#map .leaflet-tile-pane{filter:brightness(1.25) contrast(1.1) saturate(.85)}
@keyframes dpulse{0%,100%{box-shadow:0 0 14px 0 rgba(255,61,129,.5),0 0 0 3px #fff}50%{box-shadow:0 0 30px 7px rgba(255,61,129,.8),0 0 0 3px #fff}}
#map .dropm{width:42px;height:42px;border:0;box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 3px #fff;transition:transform .18s}
#map .dropm svg{width:22px;height:22px}
#map .dropm.sel{transform:scale(1.2)}
#map .dropm.ep{animation:dpulse 2.4s ease-in-out infinite}
.me{box-shadow:0 0 0 8px rgba(58,160,255,.25),0 2px 6px rgba(0,0,0,.4)}
#sheet{left:14px;right:14px;bottom:92px;gap:14px;padding:12px 12px 12px 14px;border-radius:22px;background:rgba(27,28,33,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sd{flex:none;width:46px;height:46px;border-radius:14px;background:var(--c1);display:grid;place-items:center}
.sd svg{width:24px;height:24px;fill:#fff}
.sd.ep{background:conic-gradient(#ff3d3d,#ffb627,#2ee08a,#3aa0ff,#b06bff,#ff3d3d)}
#scan{background:var(--go);color:#06281a;box-shadow:0 6px 18px rgba(46,224,138,.3)}
#scan.cd{background:#2a2b30;color:#9a9ca3;box-shadow:none;opacity:1}
@media (prefers-reduced-motion:reduce){.frame.flat .card::after,.tile::before,.crow .cv::before,.crow .cv::after,#map .dropm.ep{animation:none!important}}
</style>

<body>
<header><div class="hs"><span>🔥 <b id="streak">1</b></span><span><svg viewBox="0 0 24 24" width="22" height="22" fill="#2ee08a"><path d="M3 18h18l1-11-5 4-5-7-5 7-5-4z"/></svg><b id="lv">Lv. 1</b></span></div><div class="hs"><span><i></i><b id="coins">0</b><em class="plus">+</em></span></div></header>
<main id="main"></main>
<div id="mapwrap" hidden><div id="map"></div><button id="tb"></button><button id="loc" aria-label="Meine Position"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button><button id="scan" aria-label="Gebiet scannen">Gebiet scannen</button><button id="shop" aria-label="Shop"><svg viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-5h6v5"/></svg>Shop</button><div id="sheet" hidden></div></div>

<div id="auth" hidden><h1>Drops</h1><p id="am"></p><input id="au" placeholder="Benutzername" autocomplete="username" maxlength="20"><input id="ap" type="password" placeholder="Passwort (mind. 6 Zeichen)"><button class="btn" id="ago" style="height:50px"></button><button class="ghost" id="asw" style="width:auto;height:42px;border-radius:14px;padding:0 14px"></button><button class="ghost" id="afg" style="width:auto;height:42px;border-radius:14px;padding:0 14px">Passwort vergessen?</button>
<div id="rs" hidden style="display:flex;flex-direction:column;gap:10px"><p class="gs">Tippe auf deinen Account und lege ein neues Passwort fest.</p><div class="chs" id="rl"></div><input id="rp" type="password" placeholder="Neues Passwort (mind. 6 Zeichen)" autocomplete="new-password"><input id="rp2" type="password" placeholder="Neues Passwort wiederholen" autocomplete="new-password"><button class="btn" id="rgo" style="height:50px">Passwort speichern</button><button class="ghost" id="rbk" style="width:auto;height:42px;border-radius:14px;padding:0 14px">Zurück</button></div></div>
<div id="ov"><div id="msg"></div><div id="big"></div><button id="qs" hidden></button><div id="avd" hidden><label class="btn">🎬 Video hochladen<input id="avf" type="file" accept="video/*" hidden></label><button id="avx" hidden>Video entfernen</button></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const R=[{n:'Common',c:'#2ee08a',d:'#14a361',coins:5},{n:'Uncommon',c:'#b06bff',d:'#7a3dd8',coins:12},{n:'Rare',c:'#ffb627',d:'#ff8a1f',coins:30},{n:'Epic',c:'#ff3d81',d:'#3aa0ff',coins:100},{n:'Vinyl',c:'#ffd76a',d:'#2b2417',coins:500}];
// Wipe (einmalig pro Gerät): Inventare, Epic-Nummern, Markt und Artist-Listen werden gelöscht, Accounts bleiben
try{if(localStorage.getItem('drops-wipe')!=='2'){Object.keys(localStorage).filter(k=>/^drops-(v1|ed|market|pool|art)/.test(k)).forEach(k=>localStorage.removeItem(k));localStorage.setItem('drops-wipe','2')}}catch(e){}
// true = kein Login, dieses Gerät ist immer TheWeeknd (Admin). Für den normalen Betrieb auf false lassen.
const NOLOGIN=false;
const ACC=()=>{try{return JSON.parse(localStorage.getItem('drops-acc'))||{}}catch(e){return{}}};
if(NOLOGIN)try{const a=ACC();if(!a.theweeknd){a.theweeknd={n:'TheWeeknd',salt:'',h:''};localStorage.setItem('drops-acc',JSON.stringify(a))}localStorage.setItem('drops-user','theweeknd')}catch(e){}
const RES=k=>k.normalize('NFKD').replace(/[^a-z0-9]/g,'')==='theweeknd';
let USER=null;try{const u=localStorage.getItem('drops-user');if(u&&ACC()[u]&&(!RES(u)||(u==='theweeknd'&&(NOLOGIN||localStorage.getItem('drops-tfa')))))USER=u}catch(e){}
const KEY='drops-v1:'+(USER||'-');
let S={cards:[],coins:0},tab=2,results=[],q='',busy=false;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.cards))S=s}catch(e){}
const save=()=>{if(!USER)return;if(USER==='theweeknd')S.coins=1e9;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);

// Seltenheit: fest aus der Song-ID berechnet, damit ein Song immer gleich selten bleibt
function rarityOf(id){const h=Math.imul(id|0,2654435761)>>>0;const n=Math.floor(h/4294967296*100);return n<55?0:n<80?1:n<94?2:3}

// Nummerierte Epics haben eine Stufe (Common/Uncommon/Rare), fest aus der Song-ID berechnet
function tierOf(c){if(c.r!==3)return c.r;const n=Math.floor((Math.imul((c.id|0)^0x5bd1e995,2654435761)>>>0)/4294967296*100);return n<55?0:n<85?1:2}
function epicHTML(c,mini){
  const tr=tierOf(c),r=R[tr];
  let n=c.no||0;try{n=Math.max(n,ED[c.id]||0)}catch(e){}
  const gem='<svg viewBox="0 0 24 24"><path d="M6.5 3h11L22 9l-10 12L2 9z" fill="#fff"/><path d="M2 9h20M9.5 3 8 9l4 12 4-12-1.5-6" fill="none" stroke="#7fbf9a" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const note='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="18" r="3.2"/><circle cx="18" cy="16" r="3.2"/><path d="M9.2 4.2 20.2 2v14h-2V5.6L11.2 7V18h-2z"/></svg>';
  const cnt='<svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M5 5h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zm2.5 5.5a1.5 1.5 0 0 0 0 3h9a1.5 1.5 0 0 0 0-3z"/></svg>';
  const tri='<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
  return `<div class="frame ep${c.r===3?'':' flat'} ${mini?'s':''}" data-r="${c.r}" data-t="${tr}" data-open="${c.id}" style="--c1:${r.c};--c2:${r.d}"><div class="card epic${VK.has(vkey(c))?' vid':''}"><img src="${esc(c.cover)}" alt="Cover von ${esc(c.title)}"><div class="shade"></div>${c.no?`<span class="no">#${c.no}</span>`:''}<div class="info"><h3>${esc(c.title)}</h3><p>${esc(c.artist)}</p><div class="chips"><span class="chip rar">${gem}${r.n}</span><span class="chip gen">${note}<span>${esc(c.genre)}</span></span>${n&&c.r===3?`<span class="chip cnt">${cnt}${n}</span>`:''}</div></div>${c.preview?`<button class="play" data-play="${esc(c.preview)}" aria-label="Vorschau abspielen">${tri}</button>`:''}</div></div>`;
}

function cardHTML(c,mini){
  const r=R[c.r];
  if(c.r===3||(c.r<3&&!mini))return epicHTML(c,mini);
  return `<div class="frame${c.r<3?' flat':''} ${mini?'s':''}" data-r="${c.r}" data-open="${c.id}" style="--c1:${r.c};--c2:${r.d}"><div class="card ${mini?'mini':''}${VK.has(vkey(c))?' vid':''}"><img src="${esc(c.cover)}" alt="Cover von ${esc(c.title)}"><div class="shade"></div>${c.r===4?'<i class="vinyl"></i>':''}${c.no?`<span class="no">#${c.no}</span>`:''}<div class="info"><h3>${esc(c.title)}</h3><p>${esc(c.artist)}</p>${mini?'':`<div class="chips"><span class="chip rar">${r.n}</span><span class="chip">${esc(c.genre)}</span><span class="chip">${esc(c.year)}</span>${c.r===4?'<span class="chip">+10 🪙/Std</span>':''}${c.top?`<span class="chip">Top ${c.top}</span>`:''}</div>`}</div>${mini||!c.preview?'':`<button class="play" data-play="${esc(c.preview)}" aria-label="Vorschau abspielen">▶</button>`}</div></div>`;
}

// Vinyl-Fähigkeit: Jede Vinyl in deiner Sammlung spielt 10 Münzen pro Stunde ein (bis zu 24 Std. gesammelt)
function vinylIncome(){const n=S.cards.filter(c=>c.r===4).length;if(!n){S.vt=0;return}const now=Date.now();if(!S.vt){S.vt=now;save();return}const h=Math.min(24,Math.floor((now-S.vt)/36e5));if(h<1)return;S.vt=h>=24?now:S.vt+h*36e5;const g=h*n*10;S.coins+=g;save();toast(`Vinyl-Plattenspieler: +${g} Münzen`)}

  $('#coins').textContent=USER==='theweeknd'?'∞':S.coins;

const dayKey=()=>new Date().toISOString().slice(0,10);
function hashStr(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dist(a,b){const r=x=>x*Math.PI/180,p=r(b[0]-a[0]),l=r(b[1]-a[1]);const h=Math.sin(p/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(l/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))}
function mapSong(x){return{id:x.trackId,title:x.trackName,artist:x.artistName,genre:x.primaryGenreName||'Musik',year:(x.releaseDate||'').slice(0,4),cover:x.artworkUrl100.replace('100x100','600x600'),preview:x.previewUrl||''}}

// Drops entstehen aus Tag + Gitterzelle: gleiche Orte zeigen allen Spielern dieselben Drops
function genDrops(center){
  const cx=Math.floor(center[0]/CELL),cy=Math.floor(center[1]/CELL),done=S.opened||[],out=[];
  for(let x=cx-1;x<=cx+1;x++)for(let y=cy-1;y<=cy+1;y++)for(let i=0;i<2;i++){
    const id=`${dayKey()}:${x}:${y}:${i}`;if(done.includes(id))continue;
    const r=rng(hashStr(id)),lat=(x+r())*CELL,lng=(y+r())*CELL,n=r()*100;
    out.push({id,lat,lng,tier:n<55?0:n<80?1:n<99.9?2:3});
  }
  (S.scans||[]).forEach(d=>{if(!done.includes(d.id))out.push(d)});
  if(USER==='theweeknd'&&(pos||test)&&!done.includes('first')){S.first=S.first||{lat:center[0]+.0002,lng:center[1]+.0002};out.push({id:'first',...S.first,tier:3,first:1})}
  return out;
}

// ===== Scan: neue Drops im Umkreis =====
const SCAN_R=150,SCAN_CD=30000;let scanAt=0,scanning=false;
function scan(){
  const w=SCAN_CD-(Date.now()-scanAt);
  if(scanning)return;
  if(w>0){toast(`Scanner lädt noch ${Math.ceil(w/1000)} s`);return}
  scanning=true;scanAt=Date.now();$('#scan').classList.add('cd');
  const c=pos||[map.getCenter().lat,map.getCenter().lng];
  const ring=L.circle(c,{radius:5,color:'#2ee08a',weight:2,fillOpacity:.15,interactive:false}).addTo(map);
  let t=0;const iv=setInterval(()=>{t+=1/30;ring.setRadius(5+t*SCAN_R);ring.setStyle({opacity:1-t,fillOpacity:.15*(1-t)});
    if(t>=1){clearInterval(iv);map.removeLayer(ring);finishScan(c)}},33);
  setTimeout(()=>$('#scan').classList.remove('cd'),SCAN_CD);
}
function finishScan(c){
  const n=3+Math.floor(Math.random()*3),add=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,d=20+Math.random()*(SCAN_R-20),k=Math.random()*100;
    add.push({id:`scan:${Date.now()}:${i}`,lat:c[0]+Math.sin(a)*d/111320,lng:c[1]+Math.cos(a)*d/(111320*Math.cos(c[0]*Math.PI/180)),tier:k<50?0:k<78?1:k<99.9?2:3});
  }
  S.scans=(S.scans||[]).concat(add).slice(-40);save();refreshDrops();scanning=false;
  toast(`${n} neue Drops gefunden`);
}

// ===== Ganze Discography: zufälliges Album des Artists, daraus ein zufälliger Song =====
const DC={};
const jg=async u=>(await(await fetch(u)).json()).results||[];
async function discoSong(a,rnd,own){
  if(!DC[a]){
    const ar=await jg(`https://itunes.apple.com/search?term=${encodeURIComponent(a)}&entity=musicArtist&limit=5&country=us`),m=ar.find(x=>x.artistName.toLowerCase()===a.toLowerCase())||ar[0];
    if(!m)return null;
    DC[a]=(await jg(`https://itunes.apple.com/lookup?id=${m.artistId}&entity=album&limit=200&country=us`)).filter(x=>x.wrapperType==='collection'&&x.collectionId);
  }
  const albs=DC[a].slice();
  for(let n=0;n<6&&albs.length;n++){
    const al=albs.splice(Math.floor(rnd()*albs.length),1)[0];
    const tr=(await jg(`https://itunes.apple.com/lookup?id=${al.collectionId}&entity=song&country=us`)).filter(x=>x.wrapperType==='track'&&x.kind==='song'&&x.trackId&&x.artworkUrl100&&!own.has(x.trackId)&&x.artistName.toLowerCase().includes(a.toLowerCase()));
    if(tr.length)return mapSong(tr[Math.floor(rnd()*tr.length)]);
  }
  return null;
}
// ===== Drop öffnen (Artist aus den Top 50 des Genres; Legendär = Top 5, Episch = Top 15 …) =====
async function openDrop(){
  const d=sel;if(!d||dropBusy)return;
  dropBusy=true;updateSheet();
  try{
    const r=rng(hashStr(d.id+'s')),own=new Set(S.cards.map(c=>c.id));let s,top=0;
    if(d.first){
      const j=await(await fetch('https://itunes.apple.com/search?term=the+weeknd+after+hours&entity=song&limit=25&country=de')).json();
      s=j.results.find(x=>x.trackName==='After Hours'&&/weeknd/i.test(x.artistName));
      if(!s)throw 0;s=mapSong(s);
    }else{
      await loadPool();
      const g=GEN[Math.floor(r()*GEN.length)][0],lst=POOL[g]||[],i=Math.floor(r()*Math.min([50,30,15,5][d.tier],lst.length||1)),a=lst[i];
      if(!a){toast('Artists werden geladen. Versuch es gleich nochmal.');return}
      s=await discoSong(a,r,own);
      if(!s){toast('Dieser Drop ist leer');return}
      top=i+1;
    }
    if(own.has(s.id)){toast('Diesen Song hast du schon');return}
    const c={...s,r:d.first?3:await rarOf(s.artist,d.tier,s.title),at:Date.now(),no:d.first?1:0,top};
    S.opened=(S.opened||[]).concat(d.id).slice(-300);
    sel=null;
    addCard(c,d.first?`Dein erster Drop: ${c.title} #1! +${R[c.r].coins} Münzen`:`Drop geöffnet! +${R[c.r].coins} Münzen`);
    refreshDrops();
  }catch(e){toast('Drop konnte nicht geöffnet werden. Versuch es nochmal.')}
  finally{dropBusy=false;updateSheet()}
}

const ICG='<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M6.5 3h11L22 9l-10 12L2 9z"/></svg>',ICN='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="7" cy="18" r="3.2"/><circle cx="18" cy="16" r="3.2"/><path d="M9.2 4.2 20.2 2v14h-2V5.6L11.2 7V18h-2z"/></svg>',ICP='<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

const INFO=(()=>{try{return JSON.parse(localStorage.getItem('drops-art'))||{}}catch(e){return{}}})();
function artistInfo(a){
  if(!a)return Promise.resolve({});
  if(INFO[a]&&INFO[a].i)return Promise.resolve(INFO[a]);
  return new Promise(res=>{
    const cb='dz'+Math.random().toString(36).slice(2),sc=document.createElement('script');
    const done=v=>{delete window[cb];sc.remove();if(v){INFO[a]=v;try{localStorage.setItem('drops-art',JSON.stringify(INFO))}catch(e){}}res(v||{})};
    window[cb]=j=>{const x=j&&j.data&&j.data[0];done(x&&{p:x.picture_big,f:x.nb_fan,i:x.id})};
    sc.src=`https://api.deezer.com/search/artist?q=${encodeURIComponent(a)}&limit=1&output=jsonp&callback=${cb}`;
    sc.onerror=()=>done(null);setTimeout(()=>done(null),6000);document.head.appendChild(sc);
  });
}
// Rarität pro Song = Plays (Deezer-Rank) im Vergleich zum besten Song des Artists.
// Weit darunter = Common, mittlerer Abstand = Uncommon, nah am Besten = Rare. Epic (Tier 3) bleibt nummeriert.
const RAT_T=[.35,.7];
const nrm=t=>String(t).toLowerCase().replace(/\(.*?\)|\[.*?\]|feat.*$|ft\..*$|-.*$/g,'').replace(/[^a-z0-9]/g,'');
const TOPS={};
async function songRatio(a,title){
  const i=await artistInfo(prim(a));if(!i.i)return null;
  let t=TOPS[i.i];
  if(!t){const j=await jsonp(`https://api.deezer.com/artist/${i.i}/top?limit=100`),l=(j&&j.data)||[];t=TOPS[i.i]={best:Math.max(0,...l.map(x=>x.rank||0)),by:Object.fromEntries(l.map(x=>[nrm(x.title),x.rank||0]))}}
  if(!t.best)return null;
  let r=t.by[nrm(title)];
  if(r==null){const j=await jsonp(`https://api.deezer.com/search?q=${encodeURIComponent(`artist:"${prim(a)}" track:"${title}"`)}&limit=5`),m=((j&&j.data)||[]).find(x=>nrm(x.title)===nrm(title));r=m?m.rank||0:0;t.by[nrm(title)]=r}
  return Math.min(1,r/t.best);
}
async function rarOf(artist,tier,title){
  if(tier>=3)return tier;
  try{const q=await songRatio(artist,title);if(q!=null)return q>=RAT_T[1]?2:q>=RAT_T[0]?1:0}catch(e){}
  return Math.min(tier,2);
}

// Öffentlicher Schlüssel: prüft Gutscheine. Der private Schlüssel liegt nur bei dir und steht nie in dieser Datei.
const PUB={kty:'EC',crv:'P-256',x:'kCRTl9x1z89pZ_-Dpo-1paU8VkmF3-TQ8EmcGYVYfeI',y:'ajsUD8unBm_9U6EIVbNeysVbLJ9lLY0HXMWjlo7GC0g'},EC={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const isAdm=()=>{try{return USER==='theweeknd'&&(NOLOGIN||!!localStorage.getItem('drops-tfa'))}catch(e){return false}};
// Admin-Login per Google Authenticator (TOTP, 6 Stellen, 30 s). Achtung: Der Schlüssel steht in dieser Datei.
const TOTP_KEY='Y5U33HH2NSP3NHS2BTBC5FPKQ453WNXX';
const b32=s=>{let b='';for(const c of s.replace(/=+$/,'').toUpperCase())b+='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.slice(i,i+8),2));return new Uint8Array(o)};
async function totp(n){const k=await crypto.subtle.importKey('raw',b32(TOTP_KEY),{name:'HMAC',hash:'SHA-1'},false,['sign']),v=new DataView(new ArrayBuffer(8));v.setUint32(4,n>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,v)),o=h[19]&15;return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,'0')}
async function totpOK(v){v=String(v).replace(/\s/g,'');const n=Math.floor(Date.now()/30000);for(const d of[-1,0,1])if(await totp(n+d)===v)return true;return false}
async function signWith(d,txt){const k=await crypto.subtle.importKey('jwk',{...PUB,d},EC,false,['sign']);return crypto.subtle.sign(SG,k,new TextEncoder().encode(txt))}
async function verTxt(txt,sig){const k=await crypto.subtle.importKey('jwk',PUB,EC,false,['verify']);return crypto.subtle.verify(SG,k,sig,new TextEncoder().encode(txt))}

    if(w==='help'){aLog(`<div class="cmds">${esc(CMDS)}

    else if(w==='key'){if(!await admOK(arg))throw 'Schlüssel stimmt nicht';localStorage.setItem('drops-adm',arg);aLog('Admin-Schlüssel gespeichert. Gutschein-Links sind aktiv.','ok')}
    else if(w==='users'){aLog(Object.keys(A).map(k=>`${esc(A[k].n)}: ${cnt(k)} Karten, ${k===USER?'∞':(ud(k).coins||0)} Münzen`).join('<br>')||'Keine',)}
    else if(w==='stats'){const ks=Object.keys(A),all=ks.flatMap(k=>store(k).cards||[]);aLog(`${ks.length} Accounts, ${all.length} Karten, ${all.filter(c=>c.r===3).length} Epic`)}
    else if(w==='inv'){const k=arg.toLowerCase();if(!has(k))throw 'User nicht auf diesem Gerät';aLog((store(k).cards||[]).slice(0,40).map(c=>`${esc(c.title)} (${esc(c.artist)}) ${R[c.r].n}${c.no?' #'+c.no:''}`).join('<br>')||'Leer')}
    else if(w==='clear'||w==='take'){
      const m=w==='clear'?[0,arg]:arg.match(/^(\S+)\s+-\s+(.+)$/);if(!m)throw 'Format: take user - Titel';
      const k=String(m[1]).toLowerCase();if(!has(k))throw 'User nicht auf diesem Gerät';
      const st=store(k),n0=(st.cards||[]).length,q=w==='clear'?'':m[2].toLowerCase();
      st.cards=(st.cards||[]).filter(c=>w==='clear'?false:!c.title.toLowerCase().includes(q));st.show=(st.show||[]).filter(id=>st.cards.some(c=>c.id===id));
      wr(k,st);aLog(`${n0-st.cards.length} Karte(n) entfernt`,'ok');if(k===USER)render();
    }
    else if(w==='drop'){
      const t=RN[arg.toLowerCase()??'epic']??3,c=pos||HOME;
      S.scans=(S.scans||[]).concat({id:'adm:'+Date.now(),lat:c[0]+.0002,lng:c[1]+.0002,tier:t}).slice(-40);save();if(map)refreshDrops();aLog(`${R[t].n}-Drop auf der Map platziert`,'ok');
    }
    else if(w==='coins'){
      const m=arg.match(/^(\S+)\s+([+\-=]?)(\d+)$/);if(!m)throw 'Format: coins user +500';
      const k=m[1].toLowerCase(),o=m[2]||'+',v=+m[3],f=x=>o==='='?v:o==='-'?Math.max(0,x-v):x+v;
      if(has(k)){const st=store(k);st.coins=f(st.coins||0);wr(k,st);aLog(`${esc(k)} hat jetzt ${st.coins} Münzen`,'ok');if(k===USER)render()}
      else{const u=await mkLink({k:'$',to:k,v,o});aLog(`Gutschein für ${esc(k)}: <button class="btn" style="height:36px" data-copy="${esc(u)}">Link teilen</button>`,'ok')}
    }
    else{
      const force=w==='link',src=force?arg:line,m=src.match(/^(\S+)\s+-\s+(.+)$/);
      if(!m)throw 'Unbekannter Command. Tippe help.';
      const k=m[1].toLowerCase();let q=m[2].trim(),r=3,no=0;
      const nm=q.match(/\s+#(\d+)$/);if(nm){no=+nm[1];q=q.slice(0,nm.index)}
      const rm=q.match(/\s+(common|uncommon|rare|epic|vinyl)$/i);if(rm){r=RN[rm[1].toLowerCase()];q=q.slice(0,rm.index)}
      const sp=q.split(/\s+-\s+/);if(sp.length<2)throw 'Artist und Titel nötig: user - Artist - Titel';const s=await findSong(sp[0].trim(),sp.slice(1).join(' - ').trim());if(!s)throw 'Song nicht gefunden. Prüfe Artist und Titel.';
      no=r===3?(no||(ED[s.id]||0)+1):0;

      const lbl=`${esc(s.title)} (${esc(s.artist)}) ${R[r].n}${no?' #'+no:''}`;
      if(!force&&has(k)){const st=store(k);put(st,c);wr(k,st);aLog(`${lbl} an ${esc(k)} gegeben`,'ok');if(k===USER){render();showCard(c,'Admin-Spawn')}}

    }
  }catch(e){aLog(esc(typeof e==='string'?e:'Fehler. Prüfe Verbindung und Format.'),'er')}
}
// Gutschein einlösen: #g=<Daten>.<Signatur>, geprüft mit dem öffentlichen Schlüssel
async function loadGift(){
  const m=location.hash.match(/^#g=(.+)\.(.+)$/);if(!m)return;
  history.replaceState(null,'',location.pathname);
  try{
    if(!await verTxt(m[1],unb(m[2]))){toast('Ungültiger Gutschein');return}
    const g=JSON.parse(new TextDecoder().decode(unb(m[1])));
    if(g.to!==USER){toast(`Dieser Gutschein ist für ${g.to}`);return}
    S.red=S.red||[];if(S.red.includes(g.n)){toast('Gutschein schon eingelöst');return}
    if(g.k==='$'){S.coins=g.o==='='?g.v:g.o==='-'?Math.max(0,S.coins-g.v):S.coins+g.v;S.red.push(g.n);save();render();toast('Münzen erhalten');return}
    const x=(await jg(`https://itunes.apple.com/lookup?id=${g.id}&country=us`)).find(y=>y.trackId);if(!x)throw 0;
    const c={...mapSong(x),r:g.r,at:Date.now()};if(g.no)c.no=g.no;
    put(S,c);S.red.push(g.n);save();render();showCard(c,'Geschenk erhalten!');
  }catch(e){toast('Gutschein konnte nicht eingelöst werden')}
}

async function gPool(terms,art){
  const seen=new Set(),out=[];
  for(const t of terms)try{(await jg(`https://itunes.apple.com/search?term=${encodeURIComponent(t)}&entity=song${art?'&attribute=artistTerm':''}&limit=${art?60:100}&country=us`)).forEach(x=>{if(x.trackId&&x.previewUrl&&x.artworkUrl100&&x.releaseDate&&!seen.has(x.trackName)){seen.add(x.trackName);out.push(mapSong(x))}})}catch(e){}
  return out;
}

}
// --- Quiz: Cover / Artist / Jahr
async function quizStart(k){
  G={k:'quiz',busy:1};gamesRender();
  const l=await gPool(shuf(TERMS).slice(0,3));
  if(l.length<12){G=null;toast('Songs konnten nicht geladen werden');gamesRender();return}
  const yr=new Date().getFullYear(),qs=shuf(l).slice(0,8).map(s=>{
    const a=k==='cover'?s.title:k==='artist'?s.artist:s.year;
    const o=k==='cover'?l.filter(x=>x.title!==s.title).map(x=>x.title):k==='artist'?[...new Set(l.map(x=>x.artist))].filter(x=>x!==s.artist):[-3,-2,-1,1,2,3,4].map(d=>String(+s.year+d)).filter(v=>+v<=yr);
    return{s,a,o:shuf([a,...shuf(o).slice(0,3)])}});
  G={k:'quiz',q:k,qs,i:0,sc:0,pk:null};qLoad();gamesRender();
}
const qLoad=()=>{if(G.q==='artist'&&G.qs[G.i])gload(G.qs[G.i].s.preview)};
function quizHTML(){
  const k=G.q,n=G.qs.length;
  if(G.i>=n)return `<div class="gh"><span>${QZ[k][0].toUpperCase()}</span></div><p class="gt">${G.sc}/${n} richtig</p><p class="gs">+${G.sc*3} Münzen verdient</p><button class="btn big" data-gm="${k}">Nochmal spielen</button>`;
  const q=G.qs[G.i],pk=G.pk;
  return `<div class="gh"><span>${QZ[k][0].toUpperCase()} · ${G.i+1}/${n}</span><span>${G.sc} ✓</span></div>
  ${k==='artist'?'<button class="btn big" data-gp2>▶ Clip abspielen</button>':`<img class="gv" src="${esc(q.s.cover)}" alt="" ${k==='cover'&&pk===null?'style="filter:blur(26px)"':''}>`}
  <p class="gs">${k==='year'?esc(q.s.title)+' · '+esc(q.s.artist):k==='artist'&&pk!==null?esc(q.s.title):QZ[k][1]}</p>
  ${q.o.map((o,j)=>`<button class="mo${pk!==null?(o===q.a?' ok':o===pk?' no':''):''}" data-mo="${esc(o)}"><b>${'ABCD'[j]}</b>${esc(o)}</button>`).join('')}
  ${pk!==null?`<button class="btn big" data-gn2>${G.i+1<n?'Weiter':'Ergebnis'}</button>`:''}`;
}
function quizPick(o){if(G.pk!==null)return;G.pk=o;if(o===G.qs[G.i].a){G.sc++;gcoin(3)}gamesRender()}
document.addEventListener('click',e=>{
  if(tab!==6)return;const t=e.target,d=a=>t.closest('['+a+']');let x;
  if(x=d('data-gm')){const k=x.dataset.gm;if(k==='song'){G={k:'song',cfg:1};gamesRender()}else if(k==='mem')memStart();else quizStart(k);return}
  if(d('data-gb')){gstop();gaud=null;G=null;gamesRender();return}
  if(x=d('data-gd')){gdif=x.dataset.gd;gamesRender();return}
  if(x=d('data-gg')){ggen=x.dataset.gg;gamesRender();return}
  if(x=d('data-ge')){gera=x.dataset.ge;gamesRender();return}
  if(x=d('data-gpr')){gpairs=+x.dataset.gpr;memStart();return}
  if(d('data-gstart')||d('data-gn')){songStart();return}
  if(d('data-gp')){gclip(G.len[G.st]);return}
  if(d('data-gp2')){gclip(8);return}
  if(x=d('data-gx')){songGuess(+x.dataset.gx,x.dataset.gt,x.dataset.ga);return}
  if(d('data-gs')){G.st>=G.len.length-1?songEnd(0):songNext();return}
  if(x=d('data-mc')){memTap(+x.dataset.mc);return}
  if(x=d('data-mo')){quizPick(x.dataset.mo);return}
  if(d('data-gn2')){gstop();G.i++;G.pk=null;qLoad();gamesRender()}
});

if(USER){if(USER==='theweeknd')S.coins=1e9;if(!S.v2){S.cards.forEach(c=>{if(!(c.no===1&&c.title==='After Hours')){if(c.r===3)c.r=2;delete c.no}});S.v2=1;save()}if(!S.init){S.init=1;if(!S.cards.length)S.coins+=200;S.name=S.name||ACC()[USER].n;save()}render();loadShared();loadGift()}else authUI();
</script>
