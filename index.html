<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14090d">
<title>Drops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#14090d;--panel:#241119;--ink:#fff3ec;--mute:#b9a3a8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 0,#4a1220 0,var(--bg) 70%) fixed;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.coins{background:var(--panel);border-radius:99px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.coins i{width:14px;height:14px;border-radius:50%;background:#ffb627;box-shadow:0 0 10px #ffb627}
main{flex:1;overflow-y:auto;padding:4px 18px 110px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
nav button{flex:1;padding:14px;border:0;border-radius:16px;background:var(--panel);color:var(--mute);font:600 16px inherit;font-family:inherit}
nav button.on{background:var(--ink);color:#2a0f1a}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid #4a2a35;background:var(--panel);color:var(--ink);font:16px inherit;font-family:inherit}
button{cursor:pointer;font-family:inherit}
.btn{border:0;border-radius:14px;padding:0 18px;background:var(--ink);color:#2a0f1a;font-weight:600;font-size:16px}
.btn:disabled{opacity:.45}
.empty{color:var(--mute);text-align:center;padding:48px 20px;line-height:1.5}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #3a1d28}
.row img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--panel)}
.row .t{flex:1;min-width:0}
.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mute);margin-top:2px}
.ghost{width:42px;height:42px;border-radius:50%;border:1px solid #5a3342;background:none;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frame{--c1:#9aa3ad;--c2:#5d6670;padding:4px;border-radius:32px;background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c1));box-shadow:0 0 36px -6px var(--c1)}
.frame[data-r="2"],.frame[data-r="3"]{animation:spin 6s linear infinite}
@keyframes spin{to{--a:360deg}}
.card{position:relative;aspect-ratio:3/4.3;border-radius:28px;overflow:hidden;background:#000}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.92))}
.info{position:absolute;left:18px;right:18px;bottom:16px}
.info h3{font-size:22px;line-height:1.15;font-weight:800}
.info p{color:#d9c8cc;margin:4px 0 10px;font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:6px 12px;border-radius:99px;font-size:14px;font-weight:600}
.chip.rar{background:linear-gradient(90deg,var(--c1),var(--c2));color:#140a0e}
.play{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#2a0f1a;font-size:16px}
.mini{border-radius:20px}
.mini .info{left:10px;right:10px;bottom:10px}
.mini h3{font-size:14px}.mini p{font-size:12px;margin:2px 0 0}
.frame.s{padding:3px;border-radius:23px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(10,4,7,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;padding:20px}
#ov.on{display:flex}
#ov .frame{width:min(84vw,340px);animation-name:spin,flip;animation-duration:6s,.7s;animation-iteration-count:infinite,1;animation-timing-function:linear,cubic-bezier(.2,.8,.2,1)}
#ov .frame[data-r="0"],#ov .frame[data-r="1"]{animation:flip .7s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
#msg{font-size:20px;font-weight:600;text-align:center}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#2a0f1a;padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
[hidden]{display:none!important}
#mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0;background:#1a1014}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{background:rgba(20,9,13,.7)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--mute)!important}
.dropm{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--c1);box-shadow:0 0 18px var(--c1);display:grid;place-items:center;font-weight:800;color:#2a0f1a}
.me{width:16px;height:16px;border-radius:50%;background:#3aa0ff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(58,160,255,.25)}
#tb{position:absolute;top:10px;right:12px;z-index:500;padding:9px 14px;border-radius:99px;border:0;background:var(--panel);color:var(--ink);font-weight:600}
#sheet{position:absolute;left:18px;right:18px;bottom:96px;z-index:500;background:var(--panel);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#sheet .dot{width:14px;height:14px;border-radius:50%;background:var(--c1);box-shadow:0 0 12px var(--c1)}
#sheet .t{flex:1;min-width:0}
#sheet b,#sheet small{display:block}
#sheet small{color:var(--mute);margin-top:2px}
:root{--bg:#0e0f12;--panel:#1b1c21;--ink:#f4f1ee;--mute:#9a9ca3;--go:#2ee08a}
body{background:var(--bg)}
input{font-size:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 16px;background:#17181c;border-radius:0 0 26px 26px;position:relative;z-index:600;font-weight:600;font-size:17px}

nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;color:#555!important}

.stat{background:var(--panel);border-radius:18px;padding:16px}
.stat b{display:block;font-size:28px}
.stat small{color:var(--mute)}

@media (prefers-reduced-motion:reduce){.frame,#ov .frame{animation:none!important}}
#scan{top:134px}#scan svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#scan.cd{opacity:.5}
.ph{display:flex;gap:14px;align-items:center;margin-bottom:16px}

.ph .ghost{flex:none;font-size:18px}
.pcard{background:#3a0508;border:1.5px solid #e0242c;border-radius:24px;padding:16px;margin-bottom:16px}

.ach{display:flex;justify-content:space-around;text-align:center}.ach b{display:block;font-size:30px;color:#ff4a4a}.ach small{color:var(--mute)}
.bds{display:flex;gap:14px;overflow-x:auto}.bd{text-align:center;flex:none;width:76px}
.bd img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.bd small{display:block;font-size:12px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.9))}
.no{position:absolute;top:6px;right:6px;z-index:2;background:#fff;color:#111;border-radius:99px;padding:2px 9px;font-size:13px;font-weight:800}
.card .no{left:14px;right:auto;top:14px;font-size:15px}
.tt{position:absolute;left:8px;right:8px;bottom:8px;z-index:2}
.tt b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .chip{font-size:10px;padding:2px 8px;display:inline-block;margin-top:3px}
.tile.pin{outline:3px solid var(--go)}
#auth{position:fixed;inset:0;z-index:2050;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px}
#auth input{flex:none}#auth h1{font-size:46px}#auth p{color:var(--mute);margin-bottom:6px}
header .hs:last-child{cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bh{font-size:20px;font-weight:800;margin:8px 0 12px}
.box{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#5a1230,#1b1c21);cursor:pointer;border:2px solid #4a2a35}
.box img{width:100%;height:100%;object-fit:cover;display:block}
.box img:not([src]){visibility:hidden}
.bsh{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.9))}
.bt{position:absolute;left:12px;right:12px;bottom:10px}.bt b{display:block;font-size:17px;line-height:1.15}.bt small{color:#d9c8cc}
.bp{position:absolute;top:8px;right:8px;background:#17181c;border-radius:99px;padding:4px 10px;font-weight:700;display:flex;gap:5px;align-items:center}
.bp i{width:12px;height:12px;border-radius:50%;background:#ffb627}
.box.poor{opacity:.55}
.chs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.chs .chip{flex:none;border:0;color:var(--ink);font-family:inherit;cursor:pointer}.chs .chip.on{background:var(--ink);color:#2a0f1a}
.card video{width:100%;height:100%;object-fit:cover;display:block}
@keyframes rb{0%,100%{box-shadow:0 0 44px 4px #ff3d3d}17%{box-shadow:0 0 44px 4px #ffb627}33%{box-shadow:0 0 44px 4px #2ee08a}50%{box-shadow:0 0 44px 4px #3aa0ff}67%{box-shadow:0 0 44px 4px #b06bff}83%{box-shadow:0 0 44px 4px #ff3d81}}
.frame[data-r="2"]{animation:none;box-shadow:0 0 48px 2px var(--c1)}
.frame[data-r="3"]{background:conic-gradient(from var(--a),#ff3d3d,#ffb627,#2ee08a,#3aa0ff,#b06bff,#ff3d3d);animation:spin 4s linear infinite,rb 6s linear infinite}
#ov .frame[data-r="2"]{animation:flip .7s cubic-bezier(.2,.8,.2,1)}
#ov .frame[data-r="3"]{animation:spin 4s linear infinite,rb 6s linear infinite,flip .7s cubic-bezier(.2,.8,.2,1) 1}
.tile{box-shadow:0 0 14px -2px var(--c1)}.tile[data-r="3"]{animation:rb 6s linear infinite}
.dropm.ep{background:conic-gradient(#ff3d3d,#ffb627,#2ee08a,#3aa0ff,#b06bff,#ff3d3d)}
#map{background:#1b1b1d}
#map.osm .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.72) contrast(.92) saturate(.75)}
.leaflet-control-attribution{background:rgba(20,20,22,.7)!important;color:#777!important}.leaflet-control-attribution a{color:#777!important}
.dropm{box-shadow:0 0 16px -2px var(--c1)}
#scan{top:auto;right:auto;left:50%;bottom:16px;transform:translateX(-50%);width:auto;height:56px;padding:0 36px;border-radius:99px;background:rgba(22,22,24,.94);color:#9a9ca3;font-size:20px;font-weight:600;white-space:nowrap}
#loc{top:auto;right:auto;left:14px;bottom:16px;width:56px;height:56px;border-radius:18px}
#shop{position:absolute;z-index:500;right:14px;bottom:16px;width:62px;height:62px;border:0;border-radius:18px;background:#17181c;color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#shop svg{width:26px;height:26px;fill:none;stroke:#4ade80;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sheet{bottom:88px}
.plus{width:22px;height:22px;border-radius:50%;background:#ffb627;color:#14090d;font-style:normal;font-weight:800;display:grid;place-items:center}
</style>
</head>
<body>
<header><div class="hs"><span>🔥 <b id="streak">1</b></span><span><svg viewBox="0 0 24 24" width="22" height="22" fill="#2ee08a"><path d="M3 18h18l1-11-5 4-5-7-5 7-5-4z"/></svg><b id="lv">Lv. 1</b></span></div><div class="hs"><span><i></i><b id="coins">0</b><em class="plus">+</em></span></div></header>
<main id="main"></main>
<div id="mapwrap" hidden><div id="map"></div><button id="tb"></button><button id="loc" aria-label="Meine Position"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button><button id="scan" aria-label="Gebiet scannen">Gebiet scannen</button><button id="shop" aria-label="Shop"><svg viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-5h6v5"/></svg>Shop</button><div id="sheet" hidden></div></div>
<nav>
<button id="t2"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Map</button>
<button id="t1"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="12" height="14" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg>Sammlung</button>
<button id="t0"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>Markt</button>
<button id="t4"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg>Boxen</button>
<button id="t3"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
</nav>
<div id="auth" hidden><h1>Drops</h1><p id="am"></p><input id="au" placeholder="Benutzername" autocomplete="username" maxlength="20"><input id="ap" type="password" placeholder="Passwort (mind. 6 Zeichen)"><button class="btn" id="ago" style="height:50px"></button><button class="ghost" id="asw" style="width:auto;height:42px;border-radius:14px;padding:0 14px"></button></div>
<div id="ov"><div id="msg"></div><div id="big"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const R=[{n:'Common',c:'#2ee08a',d:'#14a361',coins:5},{n:'Uncommon',c:'#b06bff',d:'#7a3dd8',coins:12},{n:'Rare',c:'#ffb627',d:'#ff8a1f',coins:30},{n:'Epic',c:'#ff3d81',d:'#3aa0ff',coins:100}];
const ACC=()=>{try{return JSON.parse(localStorage.getItem('drops-acc'))||{}}catch(e){return{}}};
let USER=null;try{const u=localStorage.getItem('drops-user');if(u&&ACC()[u])USER=u}catch(e){}
const KEY='drops-v1:'+(USER||'-');
let S={cards:[],coins:0},tab=2,results=[],q='',busy=false;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.cards))S=s}catch(e){}
const save=()=>{if(!USER)return;if(USER==='theweeknd')S.coins=1e9;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);

// Seltenheit: fest aus der Song-ID berechnet, damit ein Song immer gleich selten bleibt
function rarityOf(id){const h=Math.imul(id|0,2654435761)>>>0;const n=Math.floor(h/4294967296*100);return n<55?0:n<80?1:n<94?2:3}

function cardHTML(c,mini){
  const r=R[c.r];
  return `<div class="frame ${mini?'s':''}" data-r="${c.r}" data-open="${c.id}" style="--c1:${r.c};--c2:${r.d}"><div class="card ${mini?'mini':''}"><img src="${esc(c.cover)}" alt="Cover von ${esc(c.title)}"><div class="shade"></div>${c.no?`<span class="no">#${c.no}</span>`:''}<div class="info"><h3>${esc(c.title)}</h3><p>${esc(c.artist)}</p>${mini?'':`<div class="chips"><span class="chip rar">${r.n}</span><span class="chip">${esc(c.genre)}</span><span class="chip">${esc(c.year)}</span>${c.top?`<span class="chip">Top ${c.top}</span>`:''}</div>`}</div>${mini||!c.preview?'':`<button class="play" data-play="${esc(c.preview)}" aria-label="Vorschau abspielen">▶</button>`}</div></div>`;
}

function render(){
  $('#coins').textContent=USER==='theweeknd'?'∞':S.coins;
  $('#streak').textContent=S.streak||1;$('#lv').textContent='Lv. '+(1+Math.floor(S.cards.length/5));
  [0,1,2,3,4].forEach(i=>$('#t'+i).className=tab===i?'on':'');
  const m=$('#main');
  m.hidden=tab===2;$('#mapwrap').hidden=tab!==2;
  if(tab===2){initMap();return}
  if(tab===0){m.innerHTML=marketHTML();
  }else if(tab===3){m.innerHTML=profileHTML()
  }else if(tab===4){m.innerHTML=boxesHTML();boxInit()
  }else{
    m.innerHTML=S.cards.length?`<div class="grid">${S.cards.map(c=>cardHTML(c,true)).join('')}</div>`:'<p class="empty">Noch keine Karten. Such einen Song und tippe auf Sammeln.</p>';
  }
}

function showCard(c,msg){$('#msg').textContent=msg||'';$('#big').innerHTML=cardHTML(c,false).replace(' data-open="'+c.id+'"','');const v=CANVAS[c.id]||CANVAS[(c.title+'|'+c.artist).toLowerCase()];if(v)$('#big .card img').outerHTML=`<video src="${esc(v)}" autoplay loop muted playsinline></video>`;$('#ov').classList.add('on')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

let audio=null,cur='';
function play(url){
  if(audio){audio.pause();if(cur===url){audio=null;cur='';return}}
  cur=url;audio=new Audio(url);audio.play().catch(()=>toast('Vorschau nicht verfügbar'));audio.onended=()=>{audio=null;cur=''};
}

document.addEventListener('click',e=>{
  const t=e.target;
  const p=t.closest('[data-play]');if(p){e.stopPropagation();play(p.dataset.play);return}
  
  if(t.closest('[data-drop]')){openDrop();return}
  const bu=t.closest('[data-buy]');if(bu){buy(bu.dataset.buy);return}

// Drops entstehen aus Tag + Gitterzelle: gleiche Orte zeigen allen Spielern dieselben Drops

  for(let x=cx-1;x<=cx+1;x++)for(let y=cy-1;y<=cy+1;y++)for(let i=0;i<2;i++){
    const id=`${dayKey()}:${x}:${y}:${i}`;if(done.includes(id))continue;
    const r=rng(hashStr(id)),lat=(x+r())*CELL,lng=(y+r())*CELL,n=r()*100;

const SCAN_R=150,SCAN_CD=30000;let scanAt=0,scanning=false;
function scan(){
  const w=SCAN_CD-(Date.now()-scanAt);
  if(scanning)return;
  if(w>0){toast(`Scanner lädt noch ${Math.ceil(w/1000)} s`);return}
  scanning=true;scanAt=Date.now();$('#scan').classList.add('cd');
  const c=pos||[map.getCenter().lat,map.getCenter().lng];
  const ring=L.circle(c,{radius:5,color:'#2ee08a',weight:2,fillOpacity:.15,interactive:false}).addTo(map);
  let t=0;const iv=setInterval(()=>{t+=1/30;ring.setRadius(5+t*SCAN_R);ring.setStyle({opacity:1-t,fillOpacity:.15*(1-t)});
    if(t>=1){clearInterval(iv);map.removeLayer(ring);finishScan(c)}},33);
  setTimeout(()=>$('#scan').classList.remove('cd'),SCAN_CD);
}
function finishScan(c){
  const n=3+Math.floor(Math.random()*3),add=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,d=20+Math.random()*(SCAN_R-20),k=Math.random()*100;
    add.push({id:`scan:${Date.now()}:${i}`,lat:c[0]+Math.sin(a)*d/111320,lng:c[1]+Math.cos(a)*d/(111320*Math.cos(c[0]*Math.PI/180)),tier:k<50?0:k<78?1:k<99.9?2:3});

      const g=GEN[Math.floor(r()*GEN.length)][0],lst=POOL[g]||[],i=Math.floor(r()*Math.min([50,30,15,5][d.tier],lst.length||1)),a=lst[i];

function boxesHTML(){
  const lst=POOL[bg]||[];
  return `<h2 style="font-size:30px;font-weight:800">Boxen</h2><p class="empty" style="padding:6px 0 12px;text-align:left">Öffne Boxen mit deinen Münzen. Common, Uncommon und Rare hängen von den Streams des Artists ab. Epic-Karten sind nummeriert.</p>
  <div class="bh">Genre-Boxen</div><div class="g2">${GEN.map(([g])=>bcard('g',g,'',GENRE_PRICE,'Zufälliger Top-50-Artist')).join('')}</div>
  <div class="bh" style="margin-top:22px">Artist-Boxen</div><div class="chs">${GEN.map(([g])=>`<button class="chip${g===bg?' on':''}" data-bgsel="${esc(g)}">${esc(g)}</button>`).join('')}</div>
  <div class="g2">${lst.slice(0,abn).map((a,i)=>bcard('a',bg,a,boxPrice(i+1),`#${i+1} in ${esc(bg)}`)).join('')||'<p class="empty">Artists werden geladen …</p>'}</div>${lst.length>abn?'<button class="btn" style="height:44px;width:100%;margin-top:14px" data-more>Mehr Artists</button>':''}`;
}
function boxInit(){
  document.querySelectorAll('[data-pic]').forEach(async el=>{const u=(await artistInfo(el.dataset.pic)).p;if(u){const i=el.querySelector('img');if(i)i.src=u}});
  if(!poolDone)loadPool().then(()=>{poolDone=true;if(tab===4)render()});
}
async function openBox(kind,g,a,price){
  if(boxBusy)return;
  if(S.coins<price){toast(`Dir fehlen ${price-S.coins} Münzen`);return}
  boxBusy=true;toast('Box wird geöffnet …');
  try{
    await loadPool();
    const k=Math.random()*100,tier=kind==='a'?(k<.1?3:0):(k<55?0:k<80?1:k<99.9?2:3),lst=POOL[g]||[];
    if(kind==='g')a=lst[Math.floor(Math.random()*Math.min([50,30,15,5][tier],lst.length||1))]||'';
    const j=await(await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(a||g)}&entity=song${a?'&attribute=artistTerm':''}&limit=50&country=de`)).json();
    const own=new Set(S.cards.map(c=>c.id));
    const list=j.results.filter(x=>x.trackId&&x.artworkUrl100&&!own.has(x.trackId)&&(!a||x.artistName.toLowerCase().includes(a.toLowerCase())));
    if(!list.length){toast('Die Box war leer. Deine Münzen bleiben dir.');return}
    const sg=mapSong(list[Math.floor(Math.random()*list.length)]),c={...sg,r:await rarOf(sg.artist,tier),at:Date.now(),top:a?lst.indexOf(a)+1:0};
    S.coins-=price;
    addCard(c,`${R[c.r].n}! +${R[c.r].coins} Münzen`);
  }catch(e){toast('Box konnte nicht geöffnet werden. Versuch es nochmal.')}
  finally{boxBusy=false}
}

// ===== Marker-Farben nach Genre (Indie läuft über die Alternative-Charts) =====
const GCOL={'Hip-Hop':'#c25200','Pop':'#0b49b0','Electronic':'#a00014','Alternative':'#10ad66'},GREY='#666b78';
const dropGenre=d=>d.first?'R&B':GEN[Math.floor(rng(hashStr(d.id+'s'))()*GEN.length)][0];
const gcol=d=>GCOL[dropGenre(d)]||GREY;
$('#shop').onclick=()=>{tab=4;render()};

// ===== Epic-Nummern (fortlaufend pro Song, gilt für alle Accounts auf diesem Gerät) =====
const ED=(()=>{try{return JSON.parse(localStorage.getItem('drops-ed'))||{}}catch(e){return{}}})();
const saveED=()=>{try{localStorage.setItem('drops-ed',JSON.stringify(ED))}catch(e){}};

// ===== Markt: Angebote und Spieler suchen =====
const mkt=()=>{try{return JSON.parse(localStorage.getItem('drops-market'))||[]}catch(e){return[]}},setMkt=m=>{try{localStorage.setItem('drops-market',JSON.stringify(m))}catch(e){}};
const ud=k=>{try{return JSON.parse(localStorage.getItem('drops-v1:'+k))||{}}catch(e){return{}}};
let mk=0;
const rchip=c=>{const r=R[c.r];return `<span class="chip rar" style="--c1:${r.c};--c2:${r.d}">${r.n}${c.r===3&&c.no?' #'+c.no:''}</span>`};
function marketHTML(){
  const M=mkt(),qq=q.toLowerCase(),mine=M.filter(x=>x.seller===USER);
  const chs=`<div class="chs"><button class="chip${mk?'':' on'}" data-mk="0">Angebote</button><button class="chip${mk?' on':''}" data-mk="1">Meine Karten verkaufen</button></div>`;
  if(mk)return chs+(S.cards.length?S.cards.map(c=>{const l=mine.find(x=>x.c.id===c.id);return `<div class="row"><img src="${esc(c.cover)}" alt=""><div class="t"><b>${esc(c.title)}</b><small>${esc(c.artist)}</small></div>${rchip(c)}${l?`<button class="btn" style="height:42px;background:var(--panel);color:var(--ink)" data-unlist="${esc(l.lid)}">${l.p} 🪙 ✕</button>`:`<button class="btn" style="height:42px" data-sell="${c.id}">Verkaufen</button>`}</div>`}).join(''):'<p class="empty">Du hast noch keine Karten zum Verkaufen.</p>');
  const ms=M.filter(x=>!qq||(x.c.title+' '+x.c.artist+' '+x.sn).toLowerCase().includes(qq));
  const us=Object.entries(ACC()).filter(([k,a])=>k!==USER&&(!qq||a.n.toLowerCase().includes(qq))).slice(0,6);
  return `<form id="f"><input id="q" type="search" placeholder="Song, Artist oder Spieler" value="${esc(q)}" autocomplete="off"><button class="btn">Suchen</button></form>`+chs+
  `<div class="bh">Spieler</div>`+(us.length?us.map(([k,a])=>{const d=ud(k),cv=(d.cards||[])[0];return `<div class="row" data-user="${esc(k)}"><img src="${cv?esc(cv.cover):''}" alt=""><div class="t"><b>${esc(d.name||a.n)}</b><small>${(d.cards||[]).length} Karten</small></div></div>`}).join(''):'<p class="empty" style="padding:14px">Kein Spieler gefunden.</p>')+
  `<div class="bh" style="margin-top:18px">Angebote</div>`+(ms.length?ms.map(x=>`<div class="row"><img src="${esc(x.c.cover)}" alt="" data-peek="${esc(x.lid)}"><div class="t" data-peek="${esc(x.lid)}"><b>${esc(x.c.title)}</b><small>${esc(x.c.artist)} · von ${esc(x.sn)}</small></div>${rchip(x.c)}<button class="btn" style="height:42px" data-buy="${esc(x.lid)}">${x.p} 🪙</button></div>`).join(''):'<p class="empty" style="padding:14px">Keine Angebote gefunden.</p>');
}
function sell(id){
  const c=S.cards.find(x=>x.id===id);if(!c)return;
  const v=prompt(`Preis für „${c.title}“ in Münzen`,String(R[c.r].coins*4)),p=Math.floor(+v);
  if(!v||!(p>0)||p>1e7)return;
  const M=mkt();M.unshift({lid:Date.now()+':'+USER+':'+id,seller:USER,sn:S.name||USER,p,c});setMkt(M);toast('Angebot eingestellt');render();
}
function buy(lid){
  const M=mkt(),i=M.findIndex(x=>x.lid===lid);if(i<0){toast('Schon verkauft');return}
  const l=M[i];
  if(l.seller===USER){toast('Das ist dein eigenes Angebot');return}
  if(S.coins<l.p){toast(`Dir fehlen ${l.p-S.coins} Münzen`);return}
  if(S.cards.some(c=>c.id===l.c.id)){toast('Diesen Song hast du schon');return}
  try{const sd=ud(l.seller);sd.cards=(sd.cards||[]).filter(c=>c.id!==l.c.id);sd.show=(sd.show||[]).filter(x=>x!==l.c.id);sd.coins=(sd.coins||0)+l.p;localStorage.setItem('drops-v1:'+l.seller,JSON.stringify(sd))}catch(e){toast('Kauf fehlgeschlagen');return}
  M.splice(i,1);setMkt(M);S.coins-=l.p;S.cards.unshift({...l.c,at:Date.now()});save();render();showCard(l.c,'Gekauft!');
}

if(USER){if(USER==='theweeknd')S.coins=1e9;if(!S.v2){S.cards.forEach(c=>{if(!(c.no===1&&c.title==='After Hours')){if(c.r===3)c.r=2;delete c.no}});S.v2=1;save()}if(!S.init){S.init=1;if(!S.cards.length)S.coins+=200;S.name=S.name||ACC()[USER].n;save()}render();loadShared()}else authUI();
</script>
</body>
</html>
